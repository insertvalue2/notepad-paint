// ---- photo input ----
const MAX_SIDE=1600;
actions.openImageFile=file=>{
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onerror=()=>{URL.revokeObjectURL(url);flash('이미지를 읽을 수 없습니다')};
  img.onload=()=>{
    URL.revokeObjectURL(url);
    let t=active();
    if(t.kind!=='draw'){newTab('draw');t=active()}
    const first=!t.photos.length&&!t.strokes.length;
    const s=Math.min(1,MAX_SIDE/Math.max(img.naturalWidth,img.naturalHeight));
    const iw=Math.round(img.naturalWidth*s),ih=Math.round(img.naturalHeight*s);
    const c=document.createElement('canvas');c.width=iw;c.height=ih;
    const x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,iw,ih);
    x.drawImage(img,0,0,iw,ih);
    let rect;
    const R=rt[t.id];
    if(first)rect={x:0,y:0,w:iw,h:ih};
    else{
      // 지금 보고 있는 화면 가운데에 놓는다
      const vz=R?R.zoom:1,vw=(R&&R.vw||800)/vz,vh=(R&&R.vh||600)/vz;
      const k=Math.min(1,vw*0.6/iw,vh*0.6/ih),w=iw*k,h=ih*k;
      rect={x:(R?R.cx:0)+vw/2-w/2,y:(R?R.cy:0)+vh/2-h/2,w,h};
    }
    const id=Math.max(0,...t.photos.map(p=>p.id))+1;
    t.photos.push({id,src:c.toDataURL('image/jpeg',0.85),...rect});
    const r=rt[t.id];
    if(r){r.redo=[];r.selPhoto=id;r.selStroke=-1;r.multi=null}
    tool.name='select';
    render();save();
    if(first&&rt[t.id]){fitView(t);applyZoom(t)}
  };
  img.src=url;
};
const hasFiles=e=>!!e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
document.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
document.addEventListener('drop',e=>{
  if(memoDrag){e.preventDefault();return}
  if(!hasFiles(e))return;
  e.preventDefault();
  const list=[...e.dataTransfer.files];
  (async()=>{for(const f of list)await openFile(f);if(list.length>1)flash(list.length+'개 파일을 열었습니다')})();
});
document.addEventListener('paste',e=>{
  const items=[...((e.clipboardData&&e.clipboardData.items)||[])];
  const it=items.find(i=>i.kind==='file'&&i.type.startsWith('image/'));
  // 코드 탭 다이어그램에서 복사한 이미지는 이미지가 아니라 고칠 수 있는 도형으로 붙인다
  if(it&&clip&&clip.diagram&&clip.png&&it.getAsFile().size===clip.png&&!inField(e)){
    e.preventDefault();
    if(active().kind!=='draw')newTab('draw');
    pasteClip();return;
  }
  if(it&&!items.some(i=>i.kind==='string'&&i.type==='text/plain')){e.preventDefault();openFile(it.getAsFile());return}
  // 그림 탭에서는 복사해 둔 요소를 붙여넣는다 (입력 칸에서는 기본 붙여넣기)
  if(!inField(e)&&active().kind==='draw'&&clip){e.preventDefault();pasteClip()}
});

// ---- export ----
// 그림 전체(사진 포함)를 여백을 두고 한 장의 이미지로 만든다. 그림이 없으면 빈 흰 종이
function composeCanvas(t){
  const bb=contentBounds(t)||{x:0,y:0,w:400,h:300},m=20;
  const bx=Math.floor(bb.x-m),by=Math.floor(bb.y-m),w=Math.ceil(bb.w+2*m),h=Math.ceil(bb.h+2*m);
  const k=Math.min(1,4000/Math.max(w,h));
  const mk=()=>{
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    const g=c.getContext('2d');g.setTransform(k,0,0,k,-bx*k,-by*k);return{c,g};
  };
  const r=rt[t.id],bgl=mk(),drl=mk();
  bgl.g.fillStyle='#fff';bgl.g.fillRect(bx,by,w,h);
  visiblePhotos(t).forEach(p=>{const im=r.imgs[p.id];if(im)bgl.g.drawImage(im,p.x,p.y,p.w,p.h)});
  paintAll(drl.g,t,-1);
  const out=document.createElement('canvas');out.width=bgl.c.width;out.height=bgl.c.height;
  const x=out.getContext('2d');x.drawImage(bgl.c,0,0);x.drawImage(drl.c,0,0);
  return out;
}
actions.exportPng=()=>{
  const t=active();
  if(t.kind!=='draw'){flash('그림판에서만 PNG로 내보낼 수 있습니다');return}
  composeCanvas(t).toBlob(b=>download(b,safeName(t.title)+'.png'),'image/png');
};
actions.copyPng=async()=>{
  const t=active();
  if(t.kind!=='draw'){flash('그림판에서만 복사할 수 있습니다');return}
  try{
    const blob=await new Promise((ok,no)=>composeCanvas(t).toBlob(b=>b?ok(b):no(new Error('blob')),'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    flash('그림을 클립보드로 복사했습니다');
  }catch(e){flash('클립보드로 복사하지 못했습니다 (브라우저 권한이나 보안 연결이 필요합니다)')}
};

// ---- theme ----
const THEME_KEY='notepad-paint-theme';
try{const m=localStorage.getItem(THEME_KEY);if(m==='dark'||m==='light')document.documentElement.dataset.theme=m}catch(e){}
$('#theme').onclick=()=>{
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  const cur=document.documentElement.dataset.theme||(sysDark?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
};

// ---- init ----
load();
render();
</script>
