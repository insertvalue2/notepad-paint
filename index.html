        const c=byName.get(p);
        S.push({tool:'dashLine',color:'#999999',size:1,pts:[[cx[i],top+hh],[cx[i],H-10]]});
        S.push({tool:'rect',color:K,size:2,pts:[[cx[i]-pw[i]/2,top],[cx[i]+pw[i]/2,top+hh]],fill:c?(UML_FILL[c.kind]||UML_FILL.class):'#eeeeee'});
        mctx.font='14px '+FONT;
        text(p,14,cx[i]-mctx.measureText(p).width/2,top+(hh-14*1.3)/2);
      });
      let n=0;
      ev.forEach((e,k)=>{
        const y=y0+k*step,a=cx[parts.indexOf(e.f)],b=cx[parts.indexOf(e.t)],call=e.kind==='call';
        if(call)n++;
        const txt=(call?n+'. ':'')+e.label;
        if(a===b){
          S.push({tool:'line',color:K,size:2,pts:[[a,y-8],[a+38,y-8]]});
          S.push({tool:'line',color:K,size:2,pts:[[a+38,y-8],[a+38,y+8]]});
          S.push({tool:'arrowOpen',color:K,size:2,pts:[[a+38,y+8],[a,y+8]]});
          mctx.font='13px '+FONT;text(txt,13,a+46,y-8);
        }else S.push({tool:call?'arrowOpen':'dashOpen',color:call?K:G,size:2,pts:[[a,y],[b,y]],label:txt});
      });
      return S;
    }};
}
// 코드 탭의 다이어그램 패널: 코드가 바뀌면 잠시 뒤 자동으로 다시 그린다
function codeView(t,host,ta,goto){
  const jp=host.querySelector('.cvpane[data-p="java"]');
  const box=jp.querySelector('.cvbody'),cv=jp.querySelector('.cvc'),empty=jp.querySelector('.cvempty'),vbar=jp.querySelector('.cvmain'),vrel=jp.querySelector('.cvrel'),info=jp.querySelector('.cvinfo');
  const ctx=cv.getContext('2d'),entrySel=vbar.querySelector('[data-v="entry"]');
  let model=null,calls=null,scene=null,z=1,px=0,py=0,moved=false,sel='',tm=0,cands=[],selRect=null,pick=false,infoKey='',sceneSeq=0;
  cv.tabIndex=0;
  const sizeOf=()=>({w:box.clientWidth,h:box.clientHeight});
  const draw=()=>{
    const d=devicePixelRatio||1;
    ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    if(!scene){infoUpdate();return}
    ctx.setTransform(d*z,0,0,d*z,d*px,d*py);scene.draw(ctx,sel);
    infoUpdate();
    if(selRect){
      ctx.save();ctx.fillStyle='rgba(105,101,219,.12)';ctx.strokeStyle='#6965db';ctx.lineWidth=1.5/z;ctx.setLineDash([6/z,4/z]);
      ctx.fillRect(selRect.x,selRect.y,selRect.w,selRect.h);ctx.strokeRect(selRect.x,selRect.y,selRect.w,selRect.h);ctx.restore();
    }
  };
  // 선택한 클래스의 관계와 범례를 다이어그램 아래쪽에 글로 풀어 준다 (학습용)
  const REL_INFO={inh:['상속','자식이 부모의 기능을 물려받아요 (extends)','arrowClosed'],impl:['구현','클래스가 인터페이스의 약속을 지켜요 (implements)','dashClosed'],assoc:['연관','필드로 다른 클래스를 알고 있어요','arrowOpen'],bi:['양방향 연관','서로를 필드로 가지고 있어요','line'],agg:['집합','전체가 부분을 가지지만 부분은 따로도 존재해요 (밖에서 받아요)','aggregation'],comp:['합성','전체가 부분을 직접 만들어요. 전체가 사라지면 부분도 사라져요','composition'],dep:['의존','메소드가 파라미터, 반환형으로 잠깐 쓰기만 해요','dashOpen']};
  const relIcon=k=>'<svg viewBox="0 0 24 24">'+ICONS[REL_INFO[k][2]]+'</svg>';
  const infoUpdate=()=>{
    const cls=scene&&scene.mode==='class'&&model;
    const key=cls?sel+'|'+t.legend+'|'+scene.rid:'x';
    if(key===infoKey)return;
    infoKey=key;
    if(!cls){info.hidden=true;return}
    const cl=scene.classes,ci=sel?cl.findIndex(c=>c.name===sel):-1;
    let h='';
    if(ci>=0){
      const mine=scene.rels.filter(r=>r.a===ci||r.b===ci);
      h+='<div class="ci-h">'+esc(sel)+(mine.length?'의 관계':' · 이어진 관계가 없어요')+'</div>';
      mine.forEach(r=>{
        const A=cl[r.a].name,B=cl[r.b].name,lb=r.label?' · '+r.label:'';
        const txt=r.kind==='comp'?B+' ◆ '+A:r.kind==='agg'?B+' ◇ '+A:r.kind==='bi'?A+' ↔ '+B:A+' → '+B;
        h+='<div class="ci-r">'+relIcon(r.kind)+'<span><b>'+REL_INFO[r.kind][0]+'</b> '+esc(txt+lb)+'</span></div>';
      });
    }
    if(t.legend!==false){
      // 상속, 구현을 포함해 관계 기호를 항상 모두 보여 주고, 지금 그림에 없는 것은 흐리게 한다 (양방향 연관은 있을 때만)
      const used=k=>scene.rels.some(r=>r.kind===k);
      const all=['inh','impl','assoc','agg','comp','dep'];
      if(used('bi'))all.splice(3,0,'bi');
      h+='<div class="ci-h">범례</div>'+all.map(k=>'<div class="ci-r'+(used(k)?'':' ci-off')+'">'+relIcon(k)+'<span><b>'+REL_INFO[k][0]+'</b> '+REL_INFO[k][1]+'</span></div>').join('');
      if(!t.compact)h+='<div class="ci-r"><span class="ci-v">+ - # ~</span><span><b>공개 범위</b> public, private, protected, 같은 패키지</span></div>';
      if(t.focus&&!sel)h+='<div class="ci-r"><span><b>집중 보기</b> 클래스를 누르면 그 클래스와 이어진 클래스만 보여요</span></div>';
    }
    info.innerHTML=h;info.hidden=!h;
  };
  const resize=()=>{
    const d=devicePixelRatio||1,{w,h}=sizeOf();
    if(!w||!h)return;
    cv.width=Math.round(w*d);cv.height=Math.round(h*d);cv.style.width=w+'px';cv.style.height=h+'px';
    if(!moved)fit();else draw();
  };
  const fit=redraw=>{
    moved=false;
    if(!scene){if(redraw!==false)draw();return}
    const{w,h}=sizeOf();
    if(scene.mode==='class')z=Math.max(0.2,Math.min(1.25,(w-24)/scene.W,(h-24)/scene.H));
    else z=Math.max(0.5,Math.min(1.1,(w-24)/scene.W));
    px=Math.max(12,(w-scene.W*z)/2);py=scene.mode==='class'?Math.max(12,(h-scene.H*z)/2):12;
    if(redraw!==false)draw();
  };
  const zoomAt=(f,cx,cy)=>{
    const nz=Math.min(4,Math.max(0.15,z*f));if(nz===z)return;
    px=cx-(cx-px)*nz/z;py=cy-(cy-py)*nz/z;z=nz;moved=true;draw();
  };
  const defaultEntry=()=>{
    if(!cands.length)return'';
    const m=cands.find(c=>/\.(main|__main__|run|start)$/.test(c.key));
    return(m||cands[0]).key;
  };
  const build=()=>{
    const mode=t.vmode;
    vbar.querySelectorAll('[data-v="class"],[data-v="flow"]').forEach(b=>b.classList.toggle('on',b.dataset.v===mode));
    vrel.hidden=mode!=='class';
    [['acc',t.hideAcc],['dep',t.dep],['assoc',t.assoc],['agg',t.agg],['comp',t.comp],['inh',t.inh],['impl',t.impl],['compact',t.compact],['focus',t.focus],['legend',t.legend]].forEach(([k,v])=>vrel.querySelector('[data-v="'+k+'"]').classList.toggle('on',v!==false&&!!v));
    infoKey='';
    entrySel.hidden=mode!=='flow';
    scene=null;selRect=null;empty.textContent='';
    const code=ta.value;
    if(!code.trim()){empty.textContent='코드를 입력하거나 붙여 넣으면 클래스 구조와 실행 흐름이 여기에 그려집니다. 위쪽 [예제 코드…]로 먼저 살펴보세요.';draw();return}
    try{model=umlModel(code,{hideAcc:t.hideAcc,dep:t.dep,assoc:t.assoc,agg:t.agg,comp:t.comp,inh:t.inh,impl:t.impl,compact:t.compact&&mode==='class'})}catch(e){model=null}
    if(!model||!model.classes.length){empty.textContent='클래스를 찾지 못했어요. class, interface 선언이 들어 있는지 확인해 주세요. (Java, C#, TypeScript, Kotlin, Python 지원)';draw();return}
    try{calls=umlCalls(model)}catch(e){calls=new Map()}
    cands=[];
    calls.forEach((list,key)=>{if(list.length){const s=umlSeq(model,calls,key);cands.push({key,n:s.ev.length})}});
    cands.sort((a,b)=>b.n-a.n);
    entrySel.innerHTML=cands.map(c=>'<option value="'+esc(c.key)+'">'+esc(c.key)+'()</option>').join('')||'<option value="">(호출 없음)</option>';
    let entry=cands.some(c=>c.key===t.entry)?t.entry:defaultEntry();
    entrySel.value=entry;
    if(mode==='flow'){
      if(!entry){empty.textContent='메소드가 다른 클래스의 메소드를 부르는 코드가 아직 없어요. 메소드 안에서 다른 객체의 메소드를 호출해 보세요.';draw();return}
      scene=umlSeqScene(model,umlSeq(model,calls,entry));
    }else{
      // 집중 보기: 고른 클래스와 그 클래스에 이어진 클래스만 그린다
      let fm=model;
      const ci=t.focus&&sel?model.classes.findIndex(c=>c.name===sel):-1;
      if(ci>=0){
        const keep=new Set([ci]);
        model.rels.forEach(r=>{if(r.a===ci)keep.add(r.b);if(r.b===ci)keep.add(r.a)});
        const idx=new Map(),classes=[];
        model.classes.forEach((c,i)=>{if(keep.has(i)){idx.set(i,classes.length);classes.push(c)}});
        const rels=model.rels.filter(r=>keep.has(r.a)&&keep.has(r.b)).map(r=>({...r,a:idx.get(r.a),b:idx.get(r.b)}));
        fm={...model,classes,rels};
      }
      scene=umlClassScene(fm);
    }
    if(scene)scene.rid=++sceneSeq;
  };
  const update=(refit,now)=>{
    clearTimeout(tm);
    const go=()=>{
      const prev=scene&&scene.mode;
      build();
      if(refit||!scene||prev!==scene.mode||!moved)fit(false);
      draw();
    };
    if(now)go();else tm=setTimeout(go,350);
  };
  // 편집기에서 커서가 있는 클래스를 다이어그램에서 강조한다
  const caret=off=>{
    if(!model||!model.classes.length)return;
    const code=ta.value;let best='',bp=-1;
    model.classes.forEach(c=>{
      const m=new RegExp('\\b(?:class|interface|enum|record|struct|trait|object)\\s+'+reEsc(c.name)+'\\b').exec(code);
      if(m&&m.index<=off&&m.index>bp){bp=m.index;best=c.name}
    });
    if(best!==sel){sel=best;if(t.focus&&t.vmode==='class')update(true,false);else draw()}
  };
  const declPos=name=>{
    const m=new RegExp('\\b(?:class|interface|enum|record|struct|trait|object)\\s+'+reEsc(name)+'\\b').exec(ta.value);
    return m?{i:m.index+m[0].length-name.length,len:name.length}:null;
  };
  // 마우스로 끌어 이동, 휠로 확대/축소, 상자를 누르면 코드의 해당 위치로 이동
  let drag=null;
  cv.addEventListener('pointerdown',e=>{
    try{cv.setPointerCapture(e.pointerId)}catch(err){}
    cv.focus({preventScroll:true});
    drag={x:e.clientX,y:e.clientY,px,py,moved:false,box:pick||e.shiftKey};
    if(drag.box){const r=cv.getBoundingClientRect();drag.wx=(e.clientX-r.left-px)/z;drag.wy=(e.clientY-r.top-py)/z}
  });
  cv.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)<4)return;
    drag.moved=true;
    if(drag.box){
      const r=cv.getBoundingClientRect(),x=(e.clientX-r.left-px)/z,y=(e.clientY-r.top-py)/z;
      selRect={x:Math.min(drag.wx,x),y:Math.min(drag.wy,y),w:Math.abs(x-drag.wx),h:Math.abs(y-drag.wy)};draw();return;
    }
    moved=true;px=drag.px+dx;py=drag.py+dy;draw();
  });
  const endDrag=e=>{
    if(!drag)return;
    const d=drag;drag=null;
    if(d.box){
      if(d.moved&&selRect&&selRect.w>4&&selRect.h>4)copyRegion();
      else if(!d.moved&&selRect){selRect=null;draw()}
      return;
    }
    if(d.moved||!scene)return;
    if(selRect){selRect=null;draw()}
    const r=cv.getBoundingClientRect(),name=scene.hit((e.clientX-r.left-px)/z,(e.clientY-r.top-py)/z);
    if(name){const p=declPos(name);if(p){sel=name;if(t.focus&&t.vmode==='class')update(true,true);else draw();goto(p.i,p.len)}}
  };
  cv.addEventListener('pointerup',endDrag);
  cv.addEventListener('pointercancel',()=>{drag=null});
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=cv.getBoundingClientRect();
    if(e.ctrlKey||scene&&scene.mode==='class')zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);
    else{py-=e.deltaY;px-=e.deltaX;moved=true;draw()}
  },{passive:false});
  new ResizeObserver(resize).observe(box);

  // 선택한 영역(없으면 전체)을 복사한다. 그림 탭에서 Ctrl+V 하면 고칠 수 있는 도형으로 붙고, 이미지로도 클립보드에 담는다
  const copyRegion=async()=>{
    if(!scene){flash('복사할 다이어그램이 없습니다');return}
    let list=scene.toStrokes();
    if(selRect){
      const r=selRect;
      list=list.filter(s=>{const b=strokeBox(s,true);return b.x<r.x+r.w&&b.x+b.w>r.x&&b.y<r.y+r.h&&b.y+b.h>r.y});
    }
    if(!list.length){flash('선택한 영역에 복사할 요소가 없습니다');return}
    let x0=Infinity,y0=Infinity;
    list.forEach(s=>{const b=strokeBox(s,true);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y)});
    list.forEach(s=>{shiftStroke(s,30-x0,30-y0);delete s.grp});
    clip={strokes:list,photos:[],n:0,diagram:true,png:0};
    let msg=list.length+'개 요소를 복사했습니다. 그림판에서 Ctrl+V로 붙여넣으면 고칠 수 있는 도형으로 붙습니다';
    flash(msg);
    try{
      const r=selRect||{x:0,y:0,w:scene.W,h:scene.H},k=2,c=document.createElement('canvas');
      c.width=Math.ceil(r.w*k);c.height=Math.ceil(r.h*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.setTransform(k,0,0,k,-r.x*k,-r.y*k);scene.draw(x,'');
      const blob=await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      clip.png=blob.size;flash(msg+' (이미지로도 담았어요)');
    }catch(e){}
  };
  cv.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){e.preventDefault();copyRegion()}
    else if(e.key==='Escape'&&selRect){selRect=null;draw()}
  });
  const toBlobCanvas=()=>{
    const s=2,c=document.createElement('canvas');c.width=Math.ceil(scene.W*s);c.height=Math.ceil(scene.H*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.setTransform(s,0,0,s,0,0);scene.draw(x,'');
    return c;
  };
  const fillJ=()=>{
    const sl=vbar.querySelector('[data-v="jcls"]');
    let names=[];
    try{names=umlModel(ta.value,{hideAcc:false,dep:false}).classes.filter(c=>c.attrs.length&&(c.kind==='class'||c.kind==='record'||c.kind==='struct')&&!/(Controller|Service|Repository|Dao|Config|Application|Test|Util|Utils)$/.test(c.name)).map(c=>c.name)}catch(e){}
    sl.innerHTML='<option value="">JSON 만들기…</option>'+(names.length>1?'<option value="*">자동 (가장 바깥 클래스)</option>':'')+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');
    sl.value='';
  };
  vbar.querySelector('[data-v="jcls"]').addEventListener('pointerdown',fillJ);
  vbar.querySelector('[data-v="jcls"]').addEventListener('focus',fillJ);
  vbar.addEventListener('change',e=>{
    if(e.target.dataset.v==='jcls'){
      const v=e.target.value;e.target.value='';
      if(!v)return;
      const r=javaToJson(ta.value,v==='*'?'':v);
      if(!r){flash('JSON으로 만들 클래스가 없어요 (필드가 있는 클래스가 필요해요)');return}
      openCodeTab(r.text+'\n','json',r.name+'.json');
      flash(r.name+' 클래스의 샘플 JSON을 새 코드에 만들었습니다');
      return;
    }
    if(e.target.dataset.v==='entry'){t.entry=e.target.value;saveSoon();update(true,true)}
  });
  const barClick=e=>{
    const b=e.target.closest('button[data-v]');if(!b)return;
    const v=b.dataset.v;
    if(v==='class'||v==='flow'){t.vmode=v;saveSoon();update(true,true)}
    else if(v==='acc'){t.hideAcc=!t.hideAcc;saveSoon();update(false,true)}
    else if(v==='dep'||v==='assoc'||v==='agg'||v==='comp'||v==='inh'||v==='impl'||v==='compact'||v==='focus'){t[v]=!t[v];saveSoon();update(v==='focus',true)}
    else if(v==='legend'){t.legend=!t.legend;saveSoon();infoKey='';build2()}
    else if(v==='fit'){fit()}
    else if(v==='zin'||v==='zout'){const{w,h}=sizeOf();zoomAt(v==='zin'?1.25:0.8,w/2,h/2)}
    else if(v==='png'){
      if(!scene){flash('그릴 다이어그램이 없습니다');return}
      toBlobCanvas().toBlob(bl=>download(bl,safeName(t.title.replace(/\.[^.]+$/,''))+'-'+(scene.mode==='class'?'클래스구조':'실행흐름')+'.png'),'image/png');
    }
    else if(v==='pick'){
      pick=!pick;b.classList.toggle('on',pick);cv.style.cursor=pick?'crosshair':'';
      if(pick)flash('다이어그램에서 끌어서 영역을 고르세요. 놓으면 바로 복사됩니다');
    }
    else if(v==='copy')copyRegion();
    else if(v==='draw'){
      if(!scene){flash('그릴 다이어그램이 없습니다');return}
      sendToDraw(scene.toStrokes(),scene.W,scene.H,t.title.replace(/\.[^.]+$/,'')+(scene.mode==='class'?' 클래스 구조':' 실행 흐름'));
    }
  };
  vbar.addEventListener('click',barClick);
  vrel.addEventListener('click',barClick);
  const build2=()=>{vrel.querySelector('[data-v="legend"]').classList.toggle('on',t.legend!==false);infoUpdate()};
  // 더보기 안의 JSON 선택 상자를 눌러도 메뉴가 닫히지 않게 한다
  vbar.querySelector('[data-v="jcls"]').addEventListener('click',e=>e.stopPropagation());
  return{update,caret,fit,resize,draw};
}

// 숫자를 글자 그대로 보존하는 JSON 파서 (JSON.parse는 큰 숫자를 깎아 버리므로 직접 읽는다)
function jsonParse(s){
  let i=0;const n=s.length,dups=[];
  const E=(m,p)=>{throw{pos:p===undefined?i:p,msg:m}};
  const ws=()=>{while(i<n){const c=s.charCodeAt(i);if(c===32||c===9||c===10||c===13)i++;else break}};
  const at=()=>i>=n?'입력이 갑자기 끝났어요':'여기에 예상하지 못한 글자 "'+s[i]+'"가 있어요';
  const ESC={'"':'"','\\':'\\','/':'/',b:'\b',f:'\f',n:'\n',r:'\r',t:'\t'};
  const str=()=>{
    const st=i;i++;let out='';
    for(;;){
      if(i>=n)E('문자열이 닫히지 않았어요 (닫는 따옴표 "가 없음)',st);
      const c=s[i];
      if(c==='"'){i++;return out}
      if(c==='\n'||c==='\r')E('문자열 안에서 줄을 바꿀 수 없어요. 줄바꿈은 \\n 으로 쓰세요',st);
      if(c==='\\'){
        const d=s[i+1];
        if(d==='u'){
          const h=s.slice(i+2,i+6);
          if(!/^[0-9a-fA-F]{4}$/.test(h))E('\\u 뒤에는 16진수 4자리가 와야 해요');
          out+=String.fromCharCode(parseInt(h,16));i+=6;continue;
        }
        if(d===undefined||!Object.prototype.hasOwnProperty.call(ESC,d))E('잘못된 이스케이프 \\'+(d||'')+' 예요. 역슬래시(\\)는 \\\\ 로 쓰세요');
        out+=ESC[d];i+=2;continue;
      }
      if(c<' ')E('문자열 안에 제어 문자가 있어요');
      out+=c;i++;
    }
  };
  const NUM=/-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/y;
  const val=d=>{
    ws();
    if(i>=n)E('값이 필요한데 입력이 끝났어요');
    if(d>200)E('중첩이 너무 깊어요 (200단계까지)');
    const c=s[i];
    if(c==='{'){
      const st=i;i++;const e=[],seen=new Set();ws();
      if(s[i]==='}'){i++;return{t:'o',e}}
      for(;;){
        ws();
        if(s[i]!=='"'){
          if(i>=n)E('객체가 닫히지 않았어요 ({ 에 대응하는 }가 없음)',st);
          if(s[i]==="'")E("키는 작은따옴표(')가 아니라 큰따옴표(\")로 감싸야 해요");
          if(/[A-Za-z_$]/.test(s[i]))E('키에 큰따옴표가 없어요. "키" 처럼 감싸 주세요');
          E('키(큰따옴표로 감싼 글자)가 와야 하는데 '+at());
        }
        const k=str();ws();
        if(s[i]!==':')E(i>=n?'입력이 갑자기 끝났어요':'키 "'+k+'" 뒤에는 콜론(:)이 와야 해요');
        i++;
        const v=val(d+1);
        if(seen.has(k)&&!dups.includes(k))dups.push(k);
        seen.add(k);e.push([k,v]);ws();
        if(s[i]===','){const cp=i;i++;ws();if(s[i]==='}')E('마지막 항목 뒤에 쉼표(,)가 남아 있어요. 쉼표를 지우세요',cp);continue}
        if(s[i]==='}'){i++;return{t:'o',e}}
        if(i>=n)E('객체가 닫히지 않았어요 ({ 에 대응하는 }가 없음)',st);
        E('항목 사이에는 쉼표(,)가 필요해요 (끝이라면 }로 닫으세요)');
      }
    }
    if(c==='['){
      const st=i;i++;const e=[];ws();
      if(s[i]===']'){i++;return{t:'a',e}}
      for(;;){
        e.push(val(d+1));ws();
        if(s[i]===','){const cp=i;i++;ws();if(s[i]===']')E('마지막 항목 뒤에 쉼표(,)가 남아 있어요. 쉼표를 지우세요',cp);continue}
        if(s[i]===']'){i++;return{t:'a',e}}
        if(i>=n)E('배열이 닫히지 않았어요 ([ 에 대응하는 ]가 없음)',st);
        E('항목 사이에는 쉼표(,)가 필요해요 (끝이라면 ]로 닫으세요)');
      }
    }
    if(c==='"')return{t:'s',v:str()};
    if(c==="'")E("문자열은 작은따옴표(')가 아니라 큰따옴표(\")로 감싸야 해요");
    if(c==='-'||(c>='0'&&c<='9')){
      NUM.lastIndex=i;const m=NUM.exec(s);
      if(!m){
        if(c==='-')E('- 뒤에는 숫자가 와야 해요');
        E('숫자 형식이 올바르지 않아요');
      }
      const raw=m[0];i+=raw.length;
      if(/[0-9]/.test(s[i]||'')&&raw==='0')E('0으로 시작하는 숫자는 쓸 수 없어요 (예: 007)',i-1);
      if(s[i]==='.')E('소수점 뒤에는 숫자가 와야 해요');
      return{t:'n',raw};
    }
    for(const[w,r]of[['true',{t:'b',v:true}],['false',{t:'b',v:false}],['null',{t:'z'}]]){
      if(s.startsWith(w,i)&&!/[\w$]/.test(s[i+w.length]||'')){i+=w.length;return r}
    }
    if(/[A-Za-z_$]/.test(c)){
      const m=/^[\w$]+/.exec(s.slice(i,i+40))[0];
      E('알 수 없는 값 "'+m+'" 이에요. 글자는 큰따옴표로 감싸고, true/false/null은 소문자로 쓰세요');
    }
    E('값이 와야 하는데 '+at());
  };
  try{
    const v=val(0);ws();
    if(i<n)E('JSON이 끝난 뒤에 남은 내용이 있어요');
    return{ok:true,v,dups};
  }catch(x){
    if(x&&typeof x.pos==='number'){
      const p=Math.min(x.pos,n),pre=s.slice(0,p).split('\n');
      return{ok:false,pos:p,msg:x.msg,line:pre.length,col:pre[pre.length-1].length+1};
    }
    return{ok:false,pos:0,msg:'읽을 수 없는 JSON이에요',line:1,col:1};
  }
}
// 읽어 둔 값을 다시 글로 만든다. indent가 빈 글자면 한 줄, 숫자는 원래 모양 그대로
function jsonOut(a,ind,sort,lv){
  lv=lv||0;
  const nl=ind?'\n'+ind.repeat(lv+1):'',end=ind?'\n'+ind.repeat(lv):'';
  if(a.t==='s')return JSON.stringify(a.v);
  if(a.t==='n')return a.raw;
  if(a.t==='b')return String(a.v);
  if(a.t==='z')return'null';
  if(a.t==='a')return a.e.length?'['+nl+a.e.map(x=>jsonOut(x,ind,sort,lv+1)).join(','+nl)+end+']':'[]';
  let e=a.e;if(sort)e=[...e].sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0);
  return e.length?'{'+nl+e.map(([k,v])=>JSON.stringify(k)+(ind?': ':':')+jsonOut(v,ind,sort,lv+1)).join(','+nl)+end+'}':'{}';
}
function jsonStats(a){
  let nodes=0,depth=0;
  (function w(x,d){nodes++;if(d>depth)depth=d;if(x.t==='a')x.e.forEach(y=>w(y,d+1));else if(x.t==='o')x.e.forEach(y=>w(y[1],d+1))})(a,1);
  return{nodes,depth};
}

// ---- Java 클래스 -> 샘플 JSON ----
const J_STR=/^(String|char|Character|CharSequence|StringBuilder|StringBuffer)$/;
const J_INT=/^(int|long|short|byte|Integer|Long|Short|Byte|BigInteger|AtomicInteger|AtomicLong)$/;
const J_DEC=/^(double|float|Double|Float|BigDecimal|Number)$/;
const J_BOOL=/^(boolean|Boolean)$/;
const J_LIST=/^(List|Set|Collection|ArrayList|LinkedList|HashSet|LinkedHashSet|TreeSet|Iterable|Queue|Deque|Stream|Vector|SortedSet)$/;
const J_MAP=/^(Map|HashMap|LinkedHashMap|TreeMap|SortedMap|ConcurrentHashMap)$/;
function javaTypeParts(ty){
  ty=(ty||'').replace(/\b(final|volatile|transient)\b/g,'').replace(/\s+/g,' ').trim();
  let arr=0;while(/\[\]$/.test(ty)){ty=ty.slice(0,-2).trim();arr++}
  const m=/^([\w.$]+)\s*(?:<(.*)>)?$/.exec(ty);
  if(!m)return{base:ty,args:[],arr};
  const args=[];
  if(m[2]){let d=0,cur='';for(const ch of m[2]){if(ch==='<')d++;else if(ch==='>')d--;if(ch===','&&d===0){args.push(cur.trim());cur=''}else cur+=ch}args.push(cur.trim())}
  return{base:m[1].split('.').pop(),args,arr};
}
function javaToJson(code,pick){
  const M=umlModel(code,{hideAcc:false,dep:false}),byName=new Map(M.classes.map(c=>[c.name,c]));
  const isData=c=>(c.kind==='class'||c.kind==='record'||c.kind==='struct')&&c.attrs.length&&!/(Controller|Service|Repository|Dao|Config|Application|Test|Util|Utils)$/.test(c.name);
  const cands=M.classes.filter(isData);
  let root=pick?byName.get(pick):null;
  if(!root){
    const used=new Set();
    M.classes.forEach(c=>c.attrs.forEach(a=>{const p=javaTypeParts(a.type);[p.base,...p.args.map(x=>javaTypeParts(x).base)].forEach(w=>{if(w!==c.name)used.add(w)})}));
    root=cands.find(c=>!used.has(c.name))||cands.slice().sort((a,b)=>b.attrs.length-a.attrs.length)[0];
  }
  if(!root)return null;
  const sample=(ty,stack)=>{
    const p=javaTypeParts(ty);
    const one=base=>{
      if(J_STR.test(base))return'string';
      if(J_INT.test(base))return 0;
      if(J_DEC.test(base))return 0.0;
      if(J_BOOL.test(base))return false;
      if(base==='UUID')return'123e4567-e89b-12d3-a456-426614174000';
      if(/^(LocalDateTime|Date|Instant|ZonedDateTime|OffsetDateTime|Timestamp|Calendar)$/.test(base))return'2024-01-01T09:00:00';
      if(base==='LocalDate')return'2024-01-01';
      if(base==='LocalTime')return'09:00:00';
      if(base==='Object')return null;
      const c=byName.get(base);
      if(!c)return null;
      if(c.kind==='enum')return c.consts[0]||'';
      if(stack.includes(c.name))return null;
      const o={};
      c.attrs.forEach(a=>{
        if(/^[A-Z][A-Z0-9_]*$/.test(a.name)||a.name==='serialVersionUID')return;
        o[a.name]=sample(a.type,[...stack,c.name]);
      });
      return o;
    };
    if(p.arr)return[sample(ty.replace(/\[\]\s*$/,''),stack)];
    if(J_LIST.test(p.base)){const e=p.args[0]?sample(p.args[0],stack):null;return e===null&&p.args[0]&&byName.has(javaTypeParts(p.args[0]).base)?[]:[e]}
    if(J_MAP.test(p.base)){const o={};o[p.args[0]&&/^(Integer|Long)$/.test(p.args[0])?'1':'key']=p.args[1]?sample(p.args[1],stack):null;return o}
    if(p.base==='Optional'&&p.args[0])return sample(p.args[0],stack);
    return one(p.base);
  };
  const v=sample(root.name,[]);
  const text=JSON.stringify(v,null,2);
  return{name:root.name,text,classes:cands.map(c=>c.name)};
}

// ---- JSON -> Java 클래스 ----
const J_KW=new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while true false null var record'.split(' '));
function jsonToJava(ast,rootName,style){
  const classes=[],used=new Set();
  const camel=k=>{
    let w=String(k).replace(/[^A-Za-z0-9_$]+(.)?/g,(m,c)=>c?c.toUpperCase():'');
    if(!w)w='field';
    if(/^[0-9]/.test(w))w='_'+w;
    w=w[0].toLowerCase()+w.slice(1);
    return J_KW.has(w)?w+'_':w;
  };
  const pascal=k=>{const c=camel(k).replace(/_$/,'');return c[0].toUpperCase()+c.slice(1)};
  const sing=k=>{const w=pascal(k);return/ies$/.test(w)&&w.length>3?w.slice(0,-3)+'y':/(ss|us)$/.test(w)?w:/s$/.test(w)&&w.length>2?w.slice(0,-1):w};
  const uniq=nm=>{let r=nm,i=2;while(used.has(r))r=nm+i++;used.add(r);return r};
  const typeOf=(nodes,hint)=>{
    // nodes: 같은 자리에 나온 값들 (배열 원소 여러 개를 합쳐서 본다)
    const kinds=new Set(nodes.map(x=>x.t));
    kinds.delete('z');
    if(!kinds.size)return'Object';
    if(kinds.size>1){
      if([...kinds].every(k=>k==='n'))return nodes.some(x=>x.t==='n'&&/[.eE]/.test(x.raw))?'double':'long';
      return'Object';
    }
    const k=[...kinds][0],nn=nodes.filter(x=>x.t===k);
    if(k==='s')return'String';
    if(k==='b')return'boolean';
    if(k==='n'){
      if(nn.some(x=>/[.eE]/.test(x.raw)))return'double';
      return nn.every(x=>Math.abs(Number(x.raw))<=2147483647)?'int':'long';
    }
    if(k==='a'){
      const inner=nn.flatMap(x=>x.e);
      return'List<'+box(typeOf(inner,sing(hint)))+'>';
    }
    const name=uniq(pascal(hint));
    makeClass(name,nn);
    return name;
  };
  const box=t=>({int:'Integer',long:'Long',double:'Double',boolean:'Boolean'})[t]||t;
  const makeClass=(name,objs)=>{
    const order=[],byKey=new Map();
    objs.forEach(o=>o.e.forEach(([k,v])=>{if(!byKey.has(k)){byKey.set(k,[]);order.push(k)}byKey.get(k).push(v)}));
    const c={name,fields:[]};classes.push(c);
    const seen=new Set();
    order.forEach(k=>{
      let f=camel(k);while(seen.has(f))f+='_';seen.add(f);
      const vals=byKey.get(k);
      // 값이 null이거나 빠진 적이 있으면 기본형 대신 래퍼형을 쓴다
      let ty=typeOf(vals,k);
      if((vals.some(x=>x.t==='z')||vals.length<objs.length))ty=box(ty);
      c.fields.push({name:f,type:ty,key:k});
    });
  };
  rootName=pascal(rootName||'Root');
  if(ast.t==='o'){used.add(rootName);makeClass(rootName,[ast])}
  else if(ast.t==='a'){
    // 배열이 맨 위에 있으면 원소 하나를 루트 클래스로 삼는다
    const inner=ast.e;
    if(inner.length&&inner.every(x=>x.t==='o')){used.clear();classes.length=0;used.add(rootName);makeClass(rootName,inner)}
    else return null;
  }else return null;
  const needList=classes.some(c=>c.fields.some(f=>f.type.includes('List<')));
  const needJp=classes.some(c=>c.fields.some(f=>f.key!==f.name));
  const L=[];
  const imports=[];
  if(needJp)imports.push('com.fasterxml.jackson.annotation.JsonProperty');
  if(style==='lombok')imports.push('lombok.Data');
  if(needList)imports.push('java.util.List');
  imports.sort();
  if(imports.length){imports.forEach(i=>L.push('import '+i+';'));L.push('')}
  const cap=s=>s[0].toUpperCase()+s.slice(1);
  classes.forEach((c,idx)=>{
    if(style==='record'){
      L.push('public record '+c.name+'('+(c.fields.length?'':'')+c.fields.map(f=>(f.key!==f.name?'@JsonProperty("'+f.key+'") ':'')+f.type+' '+f.name).join(', ')+') {}');
    }else{
      if(style==='lombok')L.push('@Data');
      L.push('public class '+c.name+' {');
      c.fields.forEach(f=>{
        if(f.key!==f.name)L.push('    @JsonProperty("'+f.key+'")');
        L.push('    private '+f.type+' '+f.name+';');
      });
      if(style!=='lombok'){
        c.fields.forEach(f=>{
          L.push('');
          L.push('    public '+f.type+' '+(f.type==='boolean'?'is':'get')+cap(f.name.replace(/_$/,''))+'() { return '+f.name+'; }');
          L.push('    public void set'+cap(f.name.replace(/_$/,''))+'('+f.type+' '+f.name+') { this.'+f.name+' = '+f.name+'; }');
        });
      }
      L.push('}');
    }
    if(idx<classes.length-1)L.push('');
  });
  return{name:rootName,text:L.join('\n')+'\n',count:classes.length};
}

    ce.textContent=c.trim()?'':'CSS 코드를 입력하면 샘플 화면에 바로 적용돼요';
    cf.srcdoc='<!doctype html><meta charset="utf-8"><style>body{margin:16px;font-family:sans-serif;line-height:1.5}</style><style>'+c+'</style><body>'+PV_SAMPLE[t.csample];
  };
  // JavaScript
  const line=(lvl,txt)=>{const d=document.createElement('div');d.className='ol '+lvl;d.textContent=txt;out.append(d);out.scrollTop=out.scrollHeight};
  const stop=msg=>{
    if(!worker)return;
    worker.terminate();worker=null;clearTimeout(wtimer);
    if(msg)line('sys',msg);
  };
  const hint=txt=>{if(/(document|window|alert|prompt|localStorage|navigator|location) is not defined/.test(txt))line('sys','힌트: 여기에는 화면(document, window)이 없어요. 화면을 다루는 코드는 이 실행기에서 쓸 수 없어요.')};
  const run=()=>{
    stop();out.textContent='';
    const code=ta.value;
    if(!code.trim()){line('sys','실행할 코드가 없어요');return}
    const n=(JS_PRE.match(/\n/g)||[]).length,pre=JS_PRE.replace('__N__',String(n));
    let url;
    try{url=URL.createObjectURL(new Blob([pre+code+'\n;postMessage({done:1})'],{type:'text/javascript'}))}
    catch(e){line('error',String(e));return}
    let w;
    try{w=worker=new Worker(url)}catch(e){line('error','실행할 수 없어요: '+e.message);return}
    line('sys','▶ 실행');
    w.onmessage=e=>{
      const d=e.data;
      if(d.done){line('sys','■ 끝 (타이머가 남아 있으면 계속 실행되다가 8초 뒤에 자동으로 멈춰요)');return}
      const txt=d.a.join(' ');line(d.l,txt);if(d.l==='error')hint(txt);
    };
    w.onerror=e=>{
      e.preventDefault();
      const m=(e.message||'오류').replace(/^Uncaught /,'');
      line('error',m+(e.lineno?'  (줄 '+Math.max(1,e.lineno-n)+')':''));hint(m);
    };
    wtimer=setTimeout(()=>{if(worker===w)stop('■ 8초가 지나 자동으로 멈췄어요')},8000);
    setTimeout(()=>URL.revokeObjectURL(url),6000);
  };
  // JSON
  const stat=panes.json.querySelector('.jstat');
  let jlast=null;
  const kb=n=>n<1024?n+'B':(n/1024).toFixed(1)+'KB';
  const valHtml=x=>{
    if(x.t==='s')return'<span class="js">"'+esc(x.v.length>300?x.v.slice(0,300)+'…':x.v)+'"</span>';
    if(x.t==='n')return'<span class="jn">'+esc(x.raw)+'</span>';
    if(x.t==='z')return'<span class="jb">null</span>';
    return'<span class="jb">'+x.v+'</span>';
  };
  const jsonNow=manual=>{
    const c=ta.value;tree.textContent='';stat.className='jstat';stat.textContent='';
    const info=html=>{const d=document.createElement('div');d.className='jmsg';d.innerHTML=html;tree.append(d);return d};
    if(!c.trim()){
      jlast=null;stat.textContent='JSON을 입력하면 형식을 바로 검사해 드려요';
      info('JSON을 입력하거나 붙여 넣으세요. 위쪽 [예제 코드…]에 JSON 예제가 있어요.');
      if(manual)flash('검사할 JSON이 없어요');
      return;
    }
    const r=jlast=jsonParse(c);
    if(!r.ok){
      stat.classList.add('bad');
      stat.innerHTML='<span>✖ '+r.line+'줄 '+r.col+'열 · '+esc(r.msg)+'</span><button data-p-act="goto">오류 위치로</button>';
      const lines=c.split('\n'),ln=lines[r.line-1]||'';
      const box=info('<b>JSON 형식 오류</b><p>'+r.line+'번째 줄 '+r.col+'번째 글자 근처예요.</p><p style="font:12px var(--mono);white-space:pre-wrap;word-break:break-all">'+esc(ln.length>160?ln.slice(Math.max(0,r.col-60),r.col+60):ln)+'</p><p class="jhelp">자주 있는 실수: 마지막 항목 뒤의 쉼표, 작은따옴표(\'), 따옴표 없는 키, 주석(// /* */)</p>');
      box.classList.add('bad');
      if(manual){flash('JSON 형식 오류: '+r.line+'줄 '+r.col+'열');goto(Math.min(r.pos,Math.max(0,c.length-1)),1)}
      return;
    }
    const st=jsonStats(r.v),root=r.v;
    const kind=root.t==='o'?'객체':root.t==='a'?'배열':'값';
    stat.classList.add('ok');
    stat.innerHTML='<span>✔ 올바른 JSON · 맨 위가 '+kind+' · 값 '+st.nodes+'개 · 깊이 '+st.depth+' · '+kb(new Blob([c]).size)+'</span>'+
      (r.dups.length?'<span class="jw">⚠ 같은 키가 겹쳐요: '+esc(r.dups.slice(0,5).join(', '))+(r.dups.length>5?' 외':'')+'</span>':'');
    if(manual)flash('올바른 JSON입니다'+(r.dups.length?' (겹치는 키가 있어요)':''));
    let count=0;
    const node=(key,x,depth)=>{
      if(++count>4000)return null;
      const kh=key===null?'':'<span class="jk">'+esc(String(key))+'</span><span class="jc">: </span>';
      if(x.t!=='o'&&x.t!=='a'){const d=document.createElement('div');d.className='jr';d.innerHTML=kh+valHtml(x);return d}
      const arr=x.t==='a',ents=arr?x.e.map((y,i)=>[i,y]):x.e;
      const det=document.createElement('details');det.open=depth<2;
      const sm=document.createElement('summary');
      sm.innerHTML=kh+'<span class="jm">'+(arr?'배열 '+ents.length+'개':'객체 '+ents.length+'개')+'</span>';
      det.append(sm);
      for(const[k,y]of ents){const n=node(k,y,depth+1);if(n)det.append(n)}
      return det;
    };
    tree.append(node(null,root,0));
    if(count>4000)info('항목이 많아 일부만 보여 드려요 (4000개까지)');
  };
  // 갱신 흐름
  const update=(refit,now)=>{
    const name=NAME[getLang()]||'none',switched=show(name);
    setBtns();clearTimeout(tm);
    if(name==='java'){if(switched)jv.resize();jv.update(refit||switched,now||switched);return}
    if(name==='html'){
      if(now||switched||t.pauto){if(now||switched)htmlNow();else tm=setTimeout(htmlNow,500)}
    }else if(name==='css'){if(now||switched)cssNow();else tm=setTimeout(cssNow,250)}
    else if(name==='json'){if(now||switched)jsonNow();else tm=setTimeout(jsonNow,300)}
    else if(name==='js'&&switched&&!out.childNodes.length)line('sys','▶ 실행 버튼(또는 Ctrl+Enter)을 누르면 코드가 실행되고 console 출력이 여기에 나와요.');
  };
  const primary=()=>{
    const name=NAME[getLang()]||'none';
    if(name==='html'){lastHtml=null;htmlNow()}else if(name==='js')run();else if(name==='css')cssNow();else if(name==='json')jsonNow(true);
    else if(name==='none')flash('아래에서 언어를 고르면 미리보기가 나옵니다');
  };
  host.querySelector('.cview').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const a=b.dataset.pAct,lg=b.dataset.pLang;
    if(lg){setLang(lg);return}
    if(!a)return;
    if(a==='reload'){lastHtml=null;htmlNow()}
    else if(a==='auto'){t.pauto=!t.pauto;saveSoon();setBtns();if(t.pauto)htmlNow()}
    else if(a.startsWith('pv-')){t.pv=a.slice(3);saveSoon();setBtns()}
    else if(a.startsWith('cs-')){t.csample=a.slice(3);saveSoon();setBtns();cssNow()}
    else if(a==='run')run();
    else if(a==='stop'){if(worker)stop('■ 정지했어요');else flash('실행 중인 코드가 없어요')}
    else if(a==='clear')out.textContent='';
    else if(a==='open'||a==='close')tree.querySelectorAll('details').forEach(d=>{d.open=a==='open'});
    else if(a==='goto'){if(jlast&&!jlast.ok)goto(Math.min(jlast.pos,Math.max(0,ta.value.length-1)),1)}
    else if(a==='check')jsonNow(true);
    else if(a==='fmt'||a==='min'||a==='sort'){
      const r=jsonParse(ta.value);
      if(!r.ok){flash('JSON 형식 오류가 있어서 바꿀 수 없어요: '+r.line+'줄 '+r.col+'열 · '+r.msg);goto(Math.min(r.pos,Math.max(0,ta.value.length-1)),1);return}
      const ind=a==='min'?'':(t.tab===0?'\t':' '.repeat(t.tab||2));
      const out=jsonOut(r.v,ind,a==='sort')+(a==='min'?'':'\n');
      if(out===ta.value){flash(a==='min'?'이미 한 줄이에요':'이미 정리되어 있어요');return}
      ta.focus();ta.select();document.execCommand('insertText',false,out);
      flash(a==='fmt'?'정리했습니다':a==='min'?'한 줄로 만들었습니다':'키를 정렬했습니다');
    }
    else if(a==='tojava'){
      const r=jsonParse(ta.value);
      if(!r.ok){flash('JSON 형식 오류부터 고쳐 주세요: '+r.line+'줄 '+r.col+'열');return}
      const res=jsonToJava(r.v,panes.json.querySelector('[data-j="root"]').value.trim()||'Root',panes.json.querySelector('[data-j="style"]').value);
      if(!res){flash('맨 위가 객체(또는 객체 배열)인 JSON만 클래스로 만들 수 있어요');return}
      openCodeTab(res.text,'java',res.name+'.java');
      flash('Java 클래스 '+res.count+'개를 새 코드에 만들었습니다');
    }
  });
  return{update,primary,caret:s=>{if(cur==='java')jv.caret(s)},resize:()=>jv.resize(),stop};
}

function codeFileName(t){
  const m=/\.[A-Za-z0-9]{1,8}$/.exec(t.title);
  if(m)return safeName(t.title);
  const k=t.lang==='auto'?guessLang(t.code):t.lang;
  return safeName(t.title)+'.'+CL[k].e.split(' ')[0];
}
function saveCode(t){
  const body=t.eol==='crlf'?t.code.replace(/\n/g,'\r\n'):t.code;
  download(new Blob([body],{type:'text/plain;charset=utf-8'}),codeFileName(t));
  flash('"'+codeFileName(t)+'" 파일로 저장했습니다');
}
const MAX_CODE_BYTES=2*1024*1024;
// 코드 파일 한 개를 읽어 코드 탭으로 연다 (비어 있는 코드 탭이 열려 있으면 거기에 채운다)
async function openCodeFile(file){
  if(file.size>MAX_CODE_BYTES){flash('"'+file.name+'"은(는) 너무 큽니다 (코드 파일은 2MB 이하만 열 수 있습니다)');return false}
  const buf=await file.arrayBuffer();
  if(new Uint8Array(buf,0,Math.min(buf.byteLength,8000)).includes(0)){flash('"'+file.name+'"은(는) 글자 파일이 아닙니다');return false}
  let text;
  try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){text=new TextDecoder('euc-kr').decode(buf)}
  text=text.replace(/^﻿/,'');
  const eol=/\r\n/.test(text)?'crlf':'lf';
  text=text.replace(/\r\n?/g,'\n');
  const cur=active();
  const reuse=cur.kind==='code'&&cur.code.trim()==='';
  if(!reuse)newTab('code');
  const t=active();
  t.code=text;t.eol=eol;t.title=file.name;t.custom=true;
  const ext=(/\.([A-Za-z0-9]+)$/.exec(file.name)||[])[1];
  t.lang=ext&&CODE_EXT_LANG[ext.toLowerCase()]?CODE_EXT_LANG[ext.toLowerCase()]:'auto';
  // 들여쓰기가 탭이면 탭, 공백이면 가장 작은 들여쓰기 폭을 따라간다
  const nTab=(text.match(/^\t/gm)||[]).length,sp=text.match(/^ {2,8}\S/gm)||[];
  if(nTab>sp.length&&nTab>2)t.tab=0;
  else if(sp.length>2){const n=Math.min(...sp.map(x=>/^ */.exec(x)[0].length));if([2,4,8].includes(n))t.tab=n}
  render();save();
  return true;
}
actions.newCode=()=>newTab('code');
actions.openCode=()=>{
  const f=document.createElement('input');f.type='file';f.multiple=true;
  f.onchange=async()=>{
    const list=[...f.files];
    for(const x of list)await openCodeFile(x);
    if(list.length>1)flash(list.length+'개 파일을 열었습니다');
  };
  f.click();
};
actions.copyCode=()=>{

  else{const ta=rt[t.id].ta;ta.focus();ta.select();document.execCommand('copy');done()}

actions.saveMd=()=>{const t=active();if(t.kind==='text')saveMd(t);else flash('메모장에서만 마크다운으로 내보낼 수 있습니다')};
actions.saveHtml=()=>{const t=active();if(t.kind==='text')saveHtml(t);else flash('메모장에서만 서식 포함 저장을 쓸 수 있습니다')};
// 프로젝트 파일(.npaint): 모든 탭을 사진과 획 그대로 저장하고 다시 불러온다
actions.saveProject=()=>{
  const data={format:'notepad-paint',version:1,tabs,activeId};
  download(new Blob([JSON.stringify(data)],{type:'application/json'}),'메모장그림-프로젝트.npaint');
  flash('프로젝트 파일로 저장했습니다 ('+tabs.length+'개)');
};
function importProject(text){
  let d;try{d=JSON.parse(text)}catch(e){flash('프로젝트 파일을 읽을 수 없습니다');return false}
  if(!d||d.format!=='notepad-paint'||!Array.isArray(d.tabs)){flash('메모장 그림 프로젝트 파일이 아닙니다');return false}
  const list=d.tabs.map(cleanTab).filter(Boolean);
  if(!list.length){flash('불러올 항목이 없습니다');return false}
  for(const t of list){t.id=nextId++;tabs.push(t)}
  activeId=list[0].id;render();save();
  flash(list.length+'개를 불러왔습니다');
  return true;
}
actions.find=()=>{
  const t=active();
  if(t.kind!=='text'&&t.kind!=='code'){flash('메모장, 코드에서만 찾기/바꾸기를 쓸 수 있습니다');return}
  rt[t.id].openFind();
};
actions.copy=()=>{const t=active();if(t.kind==='text'||t.kind==='code'){rt[t.id].ta.focus();document.execCommand('copy')}else copySel(false)};
actions.cut=()=>{const t=active();if(t.kind==='text'||t.kind==='code'){rt[t.id].ta.focus();document.execCommand('cut')}else copySel(true)};
actions.paste=()=>{
  const t=active();
  if(t.kind==='draw'){pasteClip();return}
  navigator.clipboard.readText().then(s=>{rt[t.id].ta.focus();document.execCommand('insertText',false,s)})
    .catch(()=>flash('붙여넣기는 Ctrl+V를 사용하세요'));
};
actions.openPhoto=()=>pick('image/*');
actions.save=()=>{const t=active();if(t.kind==='text')saveText(t);else if(t.kind==='code')saveCode(t);else run('exportPng')};
actions.undo=()=>{const t=active();if(t.kind==='text'||t.kind==='code'){rt[t.id].ta.focus();document.execCommand('undo')}};
actions.redo=()=>{const t=active();if(t.kind==='text'||t.kind==='code'){rt[t.id].ta.focus();document.execCommand('redo')}};
actions.rename=()=>renameTab(activeId);
document.addEventListener('keydown',e=>{
  const dig=!e.metaKey&&!e.ctrlKey&&e.altKey&&/^Digit[1-4]$/.test(e.code)?+e.code.slice(5)-1:-1;
  if(dig>=0&&e.shiftKey){
    // Alt+Shift+1: 새 텍스트 탭, Alt+Shift+2: 새 그림 탭
    e.preventDefault();
    if(dig===0)actions.newText();else if(dig===1)actions.newDraw();else if(dig===2)actions.newCode();
  }
  else if(dig>=0){
    // Alt+1~4: 그림 탭에서 선택, 펜, 텍스트, 지우개 도구로 바꾼다
    e.preventDefault();
    if(active().kind!=='draw')return;
    const a=document.activeElement;if(a&&a.blur)a.blur();
    const b=document.querySelector('[data-tool="'+['select','pen','text','eraser'][dig]+'"]');
    if(b)b.click();
  }
  else if(e.key==='F2'){e.preventDefault();actions.rename()}
  else if(e.key==='Escape')document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
});
const KEYS_COMMON=[['Ctrl+S','저장'],['Ctrl+Z','실행 취소'],['Ctrl+F','찾기 (메모, 코드)'],['Alt+Shift+1/2/3','새 메모장/그림판/코드']];
const KEYS_BY_TAB={
  text:{n:'메모장',k:[['Alt+1','본문'],['Alt+2','제목'],['Alt+L','글머리 목록'],['Alt+N','번호 목록'],['Alt+T','체크리스트'],['Alt+H','구분선'],['Alt+C','코드 블록 (붙여넣으면 자동)'],['Ctrl+B','굵게']]},
  draw:{n:'그림판',k:[['Alt+1 ~ 4','선택 / 펜 / 텍스트 / 지우개'],['Ctrl+C / V','복사 / 붙여넣기'],['Ctrl+D','복제'],['Delete','삭제']]},
  code:{n:'코드',k:[['Tab','들여쓰기'],['Ctrl+/','주석 켜기/끄기'],['Ctrl+D','줄 복제'],['Ctrl+Enter','미리보기 실행']]}
};
function fillKeys(){
  const box=document.querySelector('.keyspop');if(!box)return;
  const t=active(),g=KEYS_BY_TAB[t&&t.kind];
  const rows=l=>'<dl class="keys">'+l.map(r=>'<dt>'+r[0].split(/\s+/).map(x=>/^[/~]$/.test(x)?x:'<kbd>'+esc(x)+'</kbd>').join(' ')+'</dt><dd>'+esc(r[1])+'</dd>').join('')+'</dl>';
  box.innerHTML=(g?'<h3 class="kt">'+g.n+'</h3>'+rows(g.k):'')+'<h3 class="kt">공통</h3>'+rows(KEYS_COMMON)+'<p class="kmore">같은 키라도 메모장, 그림판, 코드마다 하는 일이 달라요. 도구 막대 버튼에 마우스를 올리면 단축키가 나와요.</p>';
}
document.getElementById('keysbtn').addEventListener('click',fillKeys);
document.addEventListener('click',e=>{
  if(e.target.closest('.about'))return;
  const ti=e.target.closest('[data-tab]');
  if(ti){
    document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
    const id=+ti.dataset.tab;
    if(id!==activeId){activeId=id;render();save()}
    return;
  }
  const item=e.target.closest('[data-act]');
  const top=e.target.closest('.menu>button');
  const wasOpen=top&&top.parentElement.classList.contains('open');
  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  if(item){run(item.dataset.act);return}
  if(top&&!wasOpen)top.parentElement.classList.add('open');
});
document.addEventListener('keydown',e=>{
  if(e.key==='F3'&&(active().kind==='text'||active().kind==='code')){e.preventDefault();rt[active().id].findNext();return}
  if(!e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='s'){e.preventDefault();if(e.shiftKey)actions.saveProject();else actions.save()}
  else if(k==='o'){e.preventDefault();actions.open()}
  else if((k==='f'||k==='h')&&(active().kind==='text'||active().kind==='code')){e.preventDefault();actions.find()}
});

window.__app={tabs:()=>tabs,active,actions,rt,closeTab,openFile,save,flash};

// ---- draw tab ----
const FONT="'D2Coding','D2 Coding','Malgun Gothic',monospace";
const SIZES={pen:4,line:4,rect:4,ellipse:4,eraser:30,strokeEraser:16,text:24,select:1,classBox:2,note:2,arrowOpen:3,arrowClosed:3,dashOpen:3,dashClosed:3,dashLine:3,aggregation:3,composition:3};
const REL_TOOLS=new Set(['arrowOpen','arrowClosed','dashOpen','dashClosed','dashLine','aggregation','composition']);
const BOXED=new Set(['classBox','note']);                 // 클래스 상자, 메모 상자
const FILLABLE=new Set(['rect','ellipse','classBox','note']);
const LABELABLE=new Set(['line',...REL_TOOLS]);          // 관계 라벨(<<use>> 등)을 붙일 수 있는 선
const NOSNAP=new Set(['pen','eraser','strokeEraser']);
const RANGES={eraser:[1,100],strokeEraser:[4,60],text:[12,120],classBox:[1,12],note:[1,12]};
const GRID=10;
let snapOn=false;try{snapOn=localStorage.getItem('notepad-paint-snap')==='1'}catch(e){}
const snapV=v=>snapOn?Math.round(v/GRID)*GRID:v;
const snapP=p=>[snapV(p[0]),snapV(p[1])];
const SIZE_LABEL={eraser:'지우개 크기',strokeEraser:'획 지우개 범위',text:'글자 크기',classBox:'선 굵기',note:'선 굵기'};
const tool={name:'pen',color:'#000000',fill:null,label:'',get size(){return SIZES[this.name]},set size(v){SIZES[this.name]=v}};
const mctx=document.createElement('canvas').getContext('2d');
// 클래스 상자(이름/속성/메소드 3칸)와 메모 상자의 배치. 글이 길면 상자가 자동으로 커진다
const textLines=v=>String(v||'').split('\n').filter(l=>l.trim()!=='');
function boxLayout(s){
  const fs=Number.isFinite(s.fs)&&s.fs>=6?s.fs:16,lh=fs*1.4,pad=fs*0.55;
  const a=s.pts[0],b=s.pts[1],x=Math.min(a[0],b[0]),y=Math.min(a[1],b[1]),w=Math.abs(b[0]-a[0]),h=Math.abs(b[1]-a[1]);
  mctx.font=fs+'px '+FONT;
  if(s.tool==='note'){
    const ls=textLines(s.text),tw=Math.max(0,...ls.map(l=>mctx.measureText(l).width));
    return{x,y,w:Math.max(w,tw+pad*2+fs,fs*6),h:Math.max(h,ls.length*lh+pad*2,lh+pad*2),fs,lh,pad,ls};
  }
  const stereo=String(s.stereo||'').trim();
  const head=stereo?[stereo,String(s.name||'')]:[String(s.name||'')];
  const at=textLines(s.attrs),me=textLines(s.meths);
  const hide=!at.length&&/interface/i.test(stereo);   // 인터페이스는 속성이 없으면 속성 칸을 생략
  let tw=0;
  head.forEach((l,i)=>{mctx.font=(i===head.length-1?'bold ':'')+fs+'px '+FONT;tw=Math.max(tw,mctx.measureText(l).width)});
  mctx.font=fs+'px '+FONT;
  [...at,...me].forEach(l=>{tw=Math.max(tw,mctx.measureText(l).width)});
  const hh=head.length*lh+pad*1.4;
  const ah0=hide?0:Math.max(at.length*lh+pad*1.4,lh+pad),mh0=Math.max(me.length*lh+pad*1.4,lh+pad);
  const extra=Math.max(0,h-(hh+ah0+mh0));
  const ah=hide?0:ah0+extra/2,mh=mh0+(hide?extra:extra/2);
  return{x,y,w:Math.max(w,tw+pad*2,fs*9),h:hh+ah+mh,hh,ah,mh,fs,lh,pad,head,at,me,hide};
}
function paintBox(ctx,s){
  const L=boxLayout(s);
  ctx.lineJoin='miter';ctx.textBaseline='top';
  if(s.tool==='note'){
    const f=Math.min(L.fs*1.2,L.w/3,L.h/3);
    ctx.beginPath();ctx.moveTo(L.x,L.y);ctx.lineTo(L.x+L.w-f,L.y);ctx.lineTo(L.x+L.w,L.y+f);
    ctx.lineTo(L.x+L.w,L.y+L.h);ctx.lineTo(L.x,L.y+L.h);ctx.closePath();
    if(s.fill){ctx.fillStyle=s.fill;ctx.fill()}
    ctx.stroke();
    ctx.beginPath();ctx.moveTo(L.x+L.w-f,L.y);ctx.lineTo(L.x+L.w-f,L.y+f);ctx.lineTo(L.x+L.w,L.y+f);ctx.stroke();
    ctx.fillStyle=s.color;ctx.textAlign='left';ctx.font=L.fs+'px '+FONT;
    L.ls.forEach((ln,i)=>ctx.fillText(ln,L.x+L.pad,L.y+L.pad+i*L.lh+(L.lh-L.fs)/2));
    return;
  }
  if(s.fill){ctx.fillStyle=s.fill;ctx.fillRect(L.x,L.y,L.w,L.h)}
  ctx.strokeRect(L.x,L.y,L.w,L.h);
  ctx.beginPath();
  ctx.moveTo(L.x,L.y+L.hh);ctx.lineTo(L.x+L.w,L.y+L.hh);
  if(!L.hide){ctx.moveTo(L.x,L.y+L.hh+L.ah);ctx.lineTo(L.x+L.w,L.y+L.hh+L.ah)}
  ctx.stroke();
  ctx.fillStyle=s.color;
  const abs=/abstract/i.test(s.stereo||'');
  ctx.textAlign='center';
  L.head.forEach((ln,i)=>{
    const isName=i===L.head.length-1;
    ctx.font=(isName?(abs?'italic bold ':'bold '):'')+L.fs+'px '+FONT;
    ctx.fillText(ln,L.x+L.w/2,L.y+L.pad*0.7+i*L.lh+(L.lh-L.fs)/2);
  });
  ctx.textAlign='left';ctx.font=L.fs+'px '+FONT;
  const list=(arr,top)=>arr.forEach((ln,i)=>ctx.fillText(ln,L.x+L.pad,top+L.pad*0.7+i*L.lh+(L.lh-L.fs)/2));
  if(!L.hide)list(L.at,L.y+L.hh);
  list(L.me,L.y+L.hh+L.ah);
}
// 선 위의 라벨 (<<use>>, <<include>> 등)
function paintLabel(ctx,s){
  const txt=String(s.label||'').trim();if(!txt)return;
  const a=s.pts[0],b=s.pts[1];
  ctx.font='14px '+FONT;ctx.textAlign='center';ctx.textBaseline='bottom';
  const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-4-s.size/2;
  ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.setLineDash([]);
  ctx.strokeText(txt,mx,my);ctx.fillStyle=s.color;ctx.fillText(txt,mx,my);
}
function distSeg(p,a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
  let u=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;u=Math.max(0,Math.min(1,u));
  return Math.hypot(p[0]-a[0]-u*dx,p[1]-a[1]-u*dy);
}
function hitStroke(s,p,tol){
  const w=s.size/2+tol;
  if(s.tool==='text'){
    mctx.font=s.size+'px '+FONT;
    const ls=s.text.split('\n'),bw=Math.max(...ls.map(l=>mctx.measureText(l).width));
    return p[0]>=s.x-tol&&p[0]<=s.x+bw+tol&&p[1]>=s.y-tol&&p[1]<=s.y+ls.length*s.size*1.3+tol;
  }
  if(BOXED.has(s.tool)){const L=boxLayout(s);return p[0]>=L.x-tol&&p[0]<=L.x+L.w+tol&&p[1]>=L.y-tol&&p[1]<=L.y+L.h+tol}
  const pts=s.pts;
  if(s.tool==='pen'){
    if(pts.length===1)return Math.hypot(p[0]-pts[0][0],p[1]-pts[0][1])<=w;
    for(let i=1;i<pts.length;i++)if(distSeg(p,pts[i-1],pts[i])<=w)return true;
    return false;
  }
  const a=pts[0],b=pts[1];
  if(s.tool==='line'||REL_TOOLS.has(s.tool))return distSeg(p,a,b)<=w+(REL_TOOLS.has(s.tool)?6:0);
  if(s.tool==='rect'){
    if(s.fill&&p[0]>=Math.min(a[0],b[0])&&p[0]<=Math.max(a[0],b[0])&&p[1]>=Math.min(a[1],b[1])&&p[1]<=Math.max(a[1],b[1]))return true;
    const c=[[a[0],a[1]],[b[0],a[1]],[b[0],b[1]],[a[0],b[1]]];return c.some((q,i)=>distSeg(p,q,c[(i+1)%4])<=w);
  }
  const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2,rx=Math.abs(b[0]-a[0])/2,ry=Math.abs(b[1]-a[1])/2;
  if(rx<1||ry<1)return Math.hypot(p[0]-cx,p[1]-cy)<=w+Math.max(rx,ry);
  const k=Math.hypot((p[0]-cx)/rx,(p[1]-cy)/ry);
  if(s.fill&&k<=1)return true;
  return Math.abs(k-1)*Math.min(rx,ry)<=w;
}
function deletedSet(t){const d=new Set();t.strokes.forEach(s=>{if(s.tool==='del')s.refs.forEach(i=>d.add(i))});return d}
function strokeAt(t,p,tol){
  const del=deletedSet(t);
  for(let i=t.strokes.length-1;i>=0;i--){
    const s=t.strokes[i];
    if(s.tool==='del'||s.tool==='photoDel'||s.tool==='eraser'||del.has(i))continue;
    if(hitStroke(s,p,tol))return i;
  }
  return -1;
}
function paintRel(ctx,s){
  const a=s.pts[0],b=s.pts[1],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);
  if(len<1){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[0]+0.01,a[1]);ctx.stroke();return}
  const dashed=s.tool==='dashOpen'||s.tool==='dashClosed'||s.tool==='dashLine';
  const head=s.tool==='arrowOpen'||s.tool==='dashOpen'?'open':s.tool==='arrowClosed'||s.tool==='dashClosed'?'tri':s.tool==='dashLine'?'none':'dia';
  const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  let L=Math.max(14,s.size*3+10);
  if(head==='tri')L=Math.min(L,len);
  if(head==='dia')L=Math.min(L,len/1.7);
  let ex=b[0],ey=b[1];
  if(head==='tri'){ex-=ux*L;ey-=uy*L}
  if(head==='dia'){ex-=ux*L*1.7;ey-=uy*L*1.7}
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(ex,ey);
  ctx.setLineDash(dashed?[Math.max(6,s.size*3),Math.max(5,s.size*2.5)]:[]);
  ctx.stroke();
  ctx.setLineDash([]);
  if(head==='open'){
    ctx.beginPath();
    ctx.moveTo(b[0]-ux*L+nx*L*0.45,b[1]-uy*L+ny*L*0.45);ctx.lineTo(b[0],b[1]);
    ctx.lineTo(b[0]-ux*L-nx*L*0.45,b[1]-uy*L-ny*L*0.45);ctx.stroke();
  }else if(head==='tri'){
    ctx.beginPath();ctx.moveTo(b[0],b[1]);
    ctx.lineTo(ex+nx*L*0.5,ey+ny*L*0.5);ctx.lineTo(ex-nx*L*0.5,ey-ny*L*0.5);
    ctx.closePath();ctx.stroke();
  }else if(head==='dia'){
    const mx=b[0]-ux*L*0.85,my=b[1]-uy*L*0.85;
    ctx.beginPath();ctx.moveTo(b[0],b[1]);
    ctx.lineTo(mx+nx*L*0.45,my+ny*L*0.45);ctx.lineTo(ex,ey);ctx.lineTo(mx-nx*L*0.45,my-ny*L*0.45);
    ctx.closePath();
    if(s.tool==='composition'){ctx.fillStyle=s.color;ctx.fill()}
    ctx.stroke();
  }
}
function paintStroke(ctx,s){
  ctx.save();
  if(s.tool==='text'){
    ctx.font=s.size+'px '+FONT;ctx.fillStyle=s.color;ctx.textBaseline='top';
    s.text.split('\n').forEach((ln,i)=>ctx.fillText(ln,s.x,s.y+(i*1.3+0.15)*s.size));
    ctx.restore();return;
  }
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=s.size;ctx.strokeStyle=s.color;
  ctx.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over';
  if(BOXED.has(s.tool)){paintBox(ctx,s);ctx.restore();return}
  if(REL_TOOLS.has(s.tool)){paintRel(ctx,s);paintLabel(ctx,s);ctx.restore();return}
  ctx.beginPath();
  if(s.tool==='pen'||s.tool==='eraser'){
    const p=s.pts;ctx.moveTo(p[0][0],p[0][1]);
    if(p.length===1)ctx.lineTo(p[0][0]+0.01,p[0][1]);
    for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);
  }else{
    const a=s.pts[0],b=s.pts[1];
    if(s.tool==='line'){ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}
    else if(s.tool==='rect')ctx.rect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
    else ctx.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2,Math.abs(b[1]-a[1])/2,0,0,Math.PI*2);
    if(s.fill&&(s.tool==='rect'||s.tool==='ellipse')){ctx.fillStyle=s.fill;ctx.fill()}
  }
  ctx.stroke();
  if(s.tool==='line')paintLabel(ctx,s);
  ctx.restore();
}
// 보이는 획을 모두 그린다 (hide: 지금 고치는 중이라 잠시 숨길 획의 번호)
function paintAll(ctx,t,hide){
  const del=deletedSet(t);let n=0;
  t.strokes.forEach((s,i)=>{if(s.tool!=='del'&&s.tool!=='photoDel'&&!del.has(i)&&i!==hide){paintStroke(ctx,s);n++}});
  return n;
}
// 화면 위치(cx, cy)와 배율을 그리기 변환으로 건다. 이후에는 모두 '작업 공간 좌표'로 그린다
function viewCtx(r,ctx){const k=r.dpr*r.zoom;ctx.setTransform(k,0,0,k,-r.cx*k,-r.cy*k)}
function redraw(t){
  const r=rt[t.id],c=r.drc;
  r.dctx.setTransform(1,0,0,1,0,0);r.dctx.clearRect(0,0,c.width,c.height);viewCtx(r,r.dctx);
  const n=paintAll(r.dctx,t,r.hide);
  const hint=$('#hint');
  if(hint)hint.style.display=n||visiblePhotos(t).length?'none':'flex';
  updateNav(t);
}
const imgW=im=>im.naturalWidth||im.width,imgH=im=>im.naturalHeight||im.height;
function visiblePhotos(t){
  const hidden=new Set();
  t.strokes.forEach(s=>{
    if(s.tool==='photoDel')hidden.add(s.id);
    else if(s.tool==='del'&&Array.isArray(s.pids))s.pids.forEach(id=>hidden.add(id));   // 여러 요소를 한 번에 지운 경우
  });
  return t.photos.filter(p=>!hidden.has(p.id));
}
function selPhoto(t){const id=rt[t.id].selPhoto;return visiblePhotos(t).find(p=>p.id===id)||null}
function redrawBg(t){
  const r=rt[t.id],c=r.bgc,x=r.bctx;
  x.setTransform(1,0,0,1,0,0);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);viewCtx(r,x);
  visiblePhotos(t).forEach(p=>{const im=r.imgs[p.id];if(im)r.bctx.drawImage(im,p.x,p.y,p.w,p.h)});
}
function refresh(t){const r=rt[t.id];r.selStroke=-1;r.multi=null;redraw(t);redrawBg(t);placePhotoBox(t)}
// 선택 모드에서 고른 획(글자, 도형 등)의 인덱스. 지워졌거나 없으면 -1
function selStrokeIdx(t){
  const i=rt[t.id].selStroke,s=Number.isInteger(i)&&i>=0?t.strokes[i]:null;
  return s&&s.tool!=='del'&&s.tool!=='photoDel'&&s.tool!=='eraser'&&!deletedSet(t).has(i)?i:-1;
}
function strokeBox(s,raw){
  if(s.tool==='text'){
    mctx.font=s.size+'px '+FONT;
    const ls=s.text.split('\n'),bw=Math.max(...ls.map(l=>mctx.measureText(l).width));
    return{x:s.x,y:s.y,w:bw,h:ls.length*s.size*1.3};
  }
  if(BOXED.has(s.tool)){const L=boxLayout(s);return{x:L.x,y:L.y,w:L.w,h:L.h}}
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const q of s.pts){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])}
  const pad=raw?0:s.size/2+(REL_TOOLS.has(s.tool)?8:2);
  return{x:x0-pad,y:y0-pad,w:x1-x0+2*pad,h:y1-y0+2*pad};
}
// 현재 선택: 여러 개(r.multi)이거나 하나(selStroke/selPhoto). 지워졌거나 안 보이는 것은 뺀다
function curSel(t){
  const r=rt[t.id];
  if(r.multi){
    const del=deletedSet(t),vis=visiblePhotos(t);
    return{
      s:r.multi.s.filter(i=>{const o=t.strokes[i];return o&&!del.has(i)&&o.tool!=='del'&&o.tool!=='photoDel'&&o.tool!=='eraser'}),
      p:r.multi.p.filter(id=>vis.some(q=>q.id===id))
    };
  }
  const si=selStrokeIdx(t),sp=selPhoto(t);
  return{s:si>=0?[si]:[],p:sp?[sp.id]:[]};
}
function setSelection(t,s,p){
  const r=rt[t.id],n=s.length+p.length;
  r.multi=null;r.selStroke=-1;r.selPhoto=null;
  if(n===1){if(s.length)r.selStroke=s[0];else r.selPhoto=p[0]}
  else if(n>1)r.multi={s:[...s],p:[...p]};
  placePhotoBox(t);
}
// 속성 카드가 가리키는 대상: 선택 모드에서는 고른 획들, 그 외에는 현재 도구
function propsTarget(t){
  if(tool.name!=='select')return{s:null,kind:tool.name,list:[]};
  const list=curSel(t).s.map(i=>t.strokes[i]);
  if(!list.length)return{s:null,kind:null,list:[]};
  const kinds=new Set(list.map(o=>o.tool));
  return{s:list[0],kind:kinds.size===1?list[0].tool:'mixed',list};
}
function syncColorUI(t){
  const {s}=propsTarget(t),c=s?s.color:tool.color,tc=$('#tcolor');
  if(tc)tc.value=c;
  document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.color===c));
}
function syncProps(t){
  const {s,kind,list}=propsTarget(t),show=(id,on)=>{$(id).style.display=on?'':'none'};
  show('#colorsec',kind!==null&&kind!=='eraser'&&kind!=='strokeEraser');
  show('#sizesec',kind!==null&&kind!=='mixed');
  const fo=list.find(o=>FILLABLE.has(o.tool)),lo=list.find(o=>LABELABLE.has(o.tool));
  show('#fillsec',list.length?!!fo:FILLABLE.has(kind));
  show('#labsec',list.length?!!lo:LABELABLE.has(kind));
  const sz=s?s.size:tool.size,rg=RANGES[kind]||[1,40],sl=$('#tsize');
  sl.min=rg[0];sl.max=rg[1];sl.value=sz;
  $('#tsizev').textContent=sz;$('#tsizel').textContent=SIZE_LABEL[kind]||'굵기';
  const f=(list.length?fo&&fo.fill:tool.fill)||'';
  document.querySelectorAll('.fl').forEach(b=>b.classList.toggle('on',(b.dataset.fill||'')===f));
  $('#fcolor').value=/^#[0-9a-f]{6}$/i.test(f)?f:'#ffffff';
  const rl=$('#rlabel');if(document.activeElement!==rl)rl.value=list.length?String(lo&&lo.label||''):tool.label;
  syncColorUI(t);
}
function placePhotoBox(t){
  const b=$('#pbox');if(!b)return;
  syncProps(t);
  const r=rt[t.id],show=tool.name==='select',p=show?selPhoto(t):null;
  const si=show?selStrokeIdx(t):-1,sb=$('#sbox');
  $('#photoctl').style.display=show?'flex':'none';
  b.style.display=p?'block':'none';
  const bx=si>=0?strokeBox(t.strokes[si]):null;
  sb.style.display=bx?'block':'none';
  if(bx){
    sb.style.left=bx.x*r.zoom+'px';sb.style.top=bx.y*r.zoom+'px';
    sb.style.width=bx.w*r.zoom+'px';sb.style.height=bx.h*r.zoom+'px';
  }
  // 여러 개를 골랐을 때는 요소마다 점선 상자를 그린다
  const ms=show&&r.multi?curSel(t):null,mn=ms?ms.s.length+ms.p.length:0,mel=$('#msel');
  mel.innerHTML='';
  if(ms){
    const rects=[...ms.s.map(i=>strokeBox(t.strokes[i],true)),...ms.p.map(id=>t.photos.find(q=>q.id===id))];
    for(const q of rects){
      const d=document.createElement('div');d.className='mi';
      d.style.left=q.x*r.zoom+'px';d.style.top=q.y*r.zoom+'px';d.style.width=q.w*r.zoom+'px';d.style.height=q.h*r.zoom+'px';
      mel.append(d);
    }
  }
  if(!show)return;
  document.querySelectorAll('.photoonly').forEach(el=>{el.style.display=p?'':'none'});
  $('#seldel').style.display=p||bx||mn?'':'none';
  if(mn){$('#photoinfo').textContent=mn+'개 선택됨: 끌어서 함께 옮기고, Delete로 삭제합니다';return}
  if(!p){$('#photoinfo').textContent=bx?'선택됨: 끌어서 옮길 수 있습니다':'클릭하거나 끌어서 요소를 선택하세요 (Shift+클릭: 추가)';return}
  b.style.left=p.x*r.zoom+'px';b.style.top=p.y*r.zoom+'px';
  b.style.width=p.w*r.zoom+'px';b.style.height=p.h*r.zoom+'px';
  const im=r.imgs[p.id];
  $('#photoinfo').textContent='사진 '+Math.round(p.w)+'×'+Math.round(p.h)+(im?' ('+Math.round(p.w/imgW(im)*100)+'%)':'');
}
function resizeRect(p,H,dx,dy,cw,ch){
  const MIN=20;let x=p.x,y=p.y,w=p.w,h=p.h;
  if(H==='move'){x+=dx;y+=dy}
  else if(H.length===2){
    const nw=Math.max(MIN,p.w+(H.includes('e')?dx:-dx)),nh=nw*p.h/p.w;
    w=nw;h=nh;
    if(H.includes('w'))x=p.x+p.w-nw;
    if(H.includes('n'))y=p.y+p.h-nh;
  }else{
    if(H==='e')w=Math.max(MIN,p.w+dx);
    if(H==='w'){w=Math.max(MIN,p.w-dx);x=p.x+p.w-w}
    if(H==='s')h=Math.max(MIN,p.h+dy);
    if(H==='n'){h=Math.max(MIN,p.h-dy);y=p.y+p.h-h}
  }
  return{x,y,w,h};
}
// 캔버스 크기 변경. 왼쪽/위쪽 모서리를 끌면 반대쪽 모서리가 고정되도록 내용(획, 사진)을 함께 옮긴다
function shiftStroke(s,dx,dy){
  if(s.pts)s.pts=s.pts.map(q=>[q[0]+dx,q[1]+dy]);
  else if(s.tool==='text'){s.x+=dx;s.y+=dy}
}
// ---- 화면(보이는 영역) 관리: 작업 공간은 끝이 없고, 캔버스는 화면 크기만 쓴다 ----
function sizeView(t){
  const r=rt[t.id],st=$('#stage');
  if(!st||!r.drc)return false;
  const W=st.clientWidth,H=st.clientHeight;
  if(!W||!H)return false;
  r.dpr=Math.min(2,window.devicePixelRatio||1);
  for(const c of [r.bgc,r.drc]){
    const pw=Math.round(W*r.dpr),ph=Math.round(H*r.dpr);
    if(c.width!==pw)c.width=pw;
    if(c.height!==ph)c.height=ph;
    c.style.width=W+'px';c.style.height=H+'px';
  }
  r.vw=W;r.vh=H;
  return true;
}
// 도구 모음, 속성 카드에 가리지 않는 영역의 왼쪽/위쪽 여백 (화면 픽셀)
function viewMargin(){const n=matchMedia('(max-width:720px)').matches;return{L:12,T:n?150:76}}
// 작업 공간의 왼쪽 위는 고정이다: 원점이 이 여백 자리에 올 때까지만 왼쪽/위로 갈 수 있고, 오른쪽/아래로만 넓어진다
function viewFloor(t,cb){
  const r=rt[t.id],m=viewMargin(),z=r.zoom;
  cb=cb===undefined?contentBounds(t):cb;
  return{x:Math.min(-(m.L+20)/z,cb?cb.x:0),y:Math.min(-(m.T+20)/z,cb?cb.y:0)};
}
// 화면 위치나 배율이 바뀌었을 때 다시 그리고 겹친 표시들의 위치도 맞춘다
function applyZoom(t){
  const r=rt[t.id],b=$('#board');
  if(!b||!sizeView(t))return;
  const fl=viewFloor(t);r.cx=Math.max(r.cx,fl.x);r.cy=Math.max(r.cy,fl.y);
  b.style.transform='translate('+(-r.cx*r.zoom)+'px,'+(-r.cy*r.zoom)+'px)';
  const g=$('#gridov');
  if(g){let st=GRID*r.zoom;while(st<8)st*=2;g.style.backgroundSize=st+'px '+st+'px';g.style.backgroundPosition=(-r.cx*r.zoom)+'px '+(-r.cy*r.zoom)+'px'}
  setStatus('끝없는 캔버스',Math.round(r.zoom*100)+'%');
  const zp=$('#zoompct');if(zp)zp.textContent=Math.round(r.zoom*100)+'%';
  redrawBg(t);redraw(t);placePhotoBox(t);
}
// 스크롤바, 가장자리 이동 버튼, '돌아가기' 버튼. 그림이 화면 밖으로 넘어간 때만 보인다
function updateNav(t){
  const r=rt[t.id],sv=$('#sbv');
  if(!sv||!r.vw||r.drc!==$('#drc'))return;
  const sh=$('#sbh'),z=r.zoom,V={x:r.cx,y:r.cy,w:r.vw/z,h:r.vh/z},cb=contentBounds(t);
  let E;
  if(r.sbDrag)E=r.sbDrag.E;
  else{
    const fl=viewFloor(t,cb),x1=Math.max(V.x+V.w,cb?cb.x+cb.w:0),y1=Math.max(V.y+V.h,cb?cb.y+cb.h:0);
    E={x:fl.x,y:fl.y,w:x1-fl.x,h:y1-fl.y};
  }
  r.ext=E;
  const needV=E.h>V.h+1,needH=E.w>V.w+1;
  sv.hidden=!needV;sh.hidden=!needH;
  const gap=sv.offsetWidth||14;
  sv.style.bottom=needH?(sh.offsetHeight||14)+'px':'0';sh.style.right=needV?gap+'px':'0';
  const frac=(v,lo,range)=>range>0?Math.min(1,Math.max(0,(v-lo)/range)):0;
  if(needV){
    const len=r.vh-(needH?(sh.offsetHeight||14):0),th=Math.min(len,Math.max(32,len*V.h/E.h)),i=sv.firstElementChild;
    i.style.height=th+'px';i.style.top=(len-th)*frac(V.y,E.y,E.h-V.h)+'px';
  }
  if(needH){
    const len=r.vw-(needV?gap:0),th=Math.min(len,Math.max(32,len*V.w/E.w)),i=sh.firstElementChild;
    i.style.width=th+'px';i.style.left=(len-th)*frac(V.x,E.x,E.w-V.w)+'px';
  }
  const away=!!cb&&(cb.x>V.x+V.w||cb.x+cb.w<V.x||cb.y>V.y+V.h||cb.y+cb.h<V.y);
  $('#backbtn').hidden=!away;
  const more={l:!!cb&&cb.x<V.x-2,r:!!cb&&cb.x+cb.w>V.x+V.w+2,u:!!cb&&cb.y<V.y-2,d:!!cb&&cb.y+cb.h>V.y+V.h+2};
  document.querySelectorAll('.edge').forEach(b=>{b.hidden=away||!more[b.dataset.e]});
}
// 마우스 위치를 기준으로 확대/축소 (Ctrl+휠)
function zoomAt(t,f,cx,cy){
  const r=rt[t.id],st=$('#stage');if(!st)return;
  const nz=Math.min(8,Math.max(0.1,r.zoom*f));if(nz===r.zoom)return;
  const b=st.getBoundingClientRect(),ox=cx-b.left,oy=cy-b.top;
  const wx=r.cx+ox/r.zoom,wy=r.cy+oy/r.zoom;
  r.zoom=nz;r.cx=wx-ox/nz;r.cy=wy-oy/nz;
  applyZoom(t);
}
// 지워지지 않고 남아 있는 그림과 사진 전체를 감싸는 사각형 (없으면 null)
function contentBounds(t){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  const add=b=>{x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)};
  const del=deletedSet(t);
  t.strokes.forEach((s,i)=>{if(s.tool==='del'||s.tool==='photoDel'||s.tool==='eraser'||del.has(i))return;add(strokeBox(s,false))});
  visiblePhotos(t).forEach(add);
  return x0===Infinity?null:{x:x0,y:y0,w:x1-x0,h:y1-y0};
}
// 그림 전체가 떠 있는 도구 모음에 가리지 않고 보이게 화면을 맞춘다 (왼쪽 위부터 시작)
function fitView(t){
  const r=rt[t.id];if(!r||!sizeView(t))return;
  const {L,T}=viewMargin(),B=72,R=16;
  const aw=Math.max(80,r.vw-L-R),ah=Math.max(80,r.vh-T-B);
  const b=contentBounds(t)||{x:0,y:0,w:0,h:0};
  const z=Math.max(0.1,Math.min(1,Math.floor(Math.min((aw-40)/Math.max(1,b.w),(ah-40)/Math.max(1,b.h))*20)/20));
  r.zoom=z;
  // 그림의 왼쪽 위가 도구 모음에 가리지 않는 영역의 왼쪽 위에 오도록 맞춘다 (그림이 없으면 원점이 그 자리)
  r.cx=b.x-(L+20)/z;r.cy=b.y-(T+20)/z;
}

    setSelection(t,[i],[]);
    const first=el.querySelector('[data-f]');first.focus();first.select&&first.select();
  };
  r.openDlg=openDlg;
  dr.ondblclick=e=>{
    if(tool.name!=='select')return;
    const si=strokeAt(t,pos(e),6/r.zoom);
    if(si>=0&&BOXED.has(t.strokes[si].tool))openDlg(si);
  };
  const stage=$('#stage');let pan=null;
  // 스크롤바: 막대를 끌거나, 빈 곳을 누르면 한 화면씩 이동
  [['sbv',true],['sbh',false]].forEach(([id,vert])=>{
    const bar=$('#'+id),thumb=bar.firstElementChild;
    bar.onpointerdown=e=>{
      if(e.button!==0)return;
      e.preventDefault();e.stopPropagation();
      commitText();
      if(e.target===thumb){
        r.sbDrag={E:r.ext,vert,p0:vert?e.clientY:e.clientX,v0:vert?r.cy:r.cx,len:vert?bar.clientHeight:bar.clientWidth,th:vert?thumb.offsetHeight:thumb.offsetWidth};
        bar.classList.add('on');
        try{bar.setPointerCapture(e.pointerId)}catch(err){}
      }else{
        const br=thumb.getBoundingClientRect(),before=vert?e.clientY<br.top:e.clientX<br.left;
        const step=(vert?r.vh:r.vw)/r.zoom*0.9*(before?-1:1);
        if(vert)r.cy+=step;else r.cx+=step;
        applyZoom(t);
      }
    };
    bar.onpointermove=e=>{
      const d=r.sbDrag;if(!d||d.vert!==vert)return;
      const span=d.len-d.th,range=vert?d.E.h-r.vh/r.zoom:d.E.w-r.vw/r.zoom;
      if(span<=0||range<=0)return;
      const lo=vert?d.E.y:d.E.x;
      const v=Math.min(lo+range,Math.max(lo,d.v0+((vert?e.clientY:e.clientX)-d.p0)/span*range));
      if(vert)r.cy=v;else r.cx=v;
      applyZoom(t);
    };
    const end=()=>{if(!r.sbDrag)return;r.sbDrag=null;bar.classList.remove('on');applyZoom(t)};
    bar.onpointerup=end;bar.onpointercancel=end;
  });
  // 그림이 있는 쪽 가장자리 버튼: 누르면 그 방향으로 그림이 보이게 이동
  host.querySelectorAll('.edge').forEach(b=>{
    b.onclick=()=>{
      const cb=contentBounds(t);if(!cb)return;
      const z=r.zoom,Vw=r.vw/z,Vh=r.vh/z,m=40/z,d=b.dataset.e;
      if(d==='l')r.cx-=Math.min(Vw*0.8,r.cx-cb.x+m);
      else if(d==='r')r.cx+=Math.min(Vw*0.8,cb.x+cb.w-(r.cx+Vw)+m);
      else if(d==='u')r.cy-=Math.min(Vh*0.8,r.cy-cb.y+m);
      else r.cy+=Math.min(Vh*0.8,cb.y+cb.h-(r.cy+Vh)+m);
      applyZoom(t);
    };
  });
  $('#backbtn').onclick=()=>{fitView(t);applyZoom(t)};
  // 화면 크기가 바뀌면 캔버스를 새 크기로 다시 맞춘다
  if(window.ResizeObserver){
    new ResizeObserver(()=>{if(rt[t.id]!==r||!stage.isConnected)return;applyZoom(t)}).observe(stage);
  }
  // 휠: 화면 이동 (Shift+휠은 가로), Ctrl+휠: 확대/축소
  stage.addEventListener('wheel',e=>{
    e.preventDefault();
    if(e.ctrlKey){zoomAt(t,e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY);return}
    let dx=e.deltaX,dy=e.deltaY;
    if(e.deltaMode===1){dx*=16;dy*=16}
    if(e.shiftKey&&!dx){dx=dy;dy=0}
    r.cx+=dx/r.zoom;r.cy+=dy/r.zoom;applyZoom(t);
  },{passive:false});
  // 터치: 손가락 두 개로 확대/축소와 화면 이동 (그리던 획은 취소)
  const touches=new Map();let pinch=null;
  const cancelGesture=()=>{
    if(cur){
      if(cur.tool!=='del'){const i=t.strokes.indexOf(cur);if(i>=0)t.strokes.splice(i,1)}
      cur=null;
    }
    if(sdrag){
      for(const it of sdrag.items){const o=it.orig,s=it.ref;if(o.pts)s.pts=o.pts.map(c=>c.slice());else{s.x=o.x;s.y=o.y}}
      sdrag=null;showGuides(null,null);
    }
    if(mq){mq=null;$('#mbox').style.display='none'}
    r.drawing=false;redraw(t);redrawBg(t);placePhotoBox(t);
  };
  dr.oncontextmenu=e=>e.preventDefault();
  dr.onpointerdown=e=>{
    if(e.pointerType==='touch'){
      touches.set(e.pointerId,[e.clientX,e.clientY]);
      if(touches.size>=2){
        e.preventDefault();cancelGesture();
        const [a,b]=[...touches.values()];
        pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),mx:(a[0]+b[0])/2,my:(a[1]+b[1])/2};
        return;
      }
    }
    const ae=document.activeElement;if(ae&&ae.tagName==='BUTTON')ae.blur();
    if(e.button===1||(e.button===0&&spaceDown)){
      // 휠 클릭 또는 Space를 누른 채 끌면 화면 이동
      e.preventDefault();
      pan={x:e.clientX,y:e.clientY,cx:r.cx,cy:r.cy};
      try{dr.setPointerCapture(e.pointerId)}catch(err){}
      dr.style.cursor='grabbing';
      return;
    }
    if(e.button!==0)return;
    e.preventDefault();
    closeDlg(true);
    if(tool.name==='select'){
      const q=pos(e),si=strokeAt(t,q,6/r.zoom),cs=curSel(t);
      const hit=si>=0?null:[...visiblePhotos(t)].reverse().find(ph=>q[0]>=ph.x&&q[0]<=ph.x+ph.w&&q[1]>=ph.y&&q[1]<=ph.y+ph.h);
      if(e.shiftKey&&(si>=0||hit)){
        // Shift+클릭: 선택에 추가하거나 뺀다
        const S=new Set(cs.s),P=new Set(cs.p);
        if(si>=0){if(!S.delete(si))S.add(si)}else if(!P.delete(hit.id))P.add(hit.id);
        setSelection(t,[...S],[...P]);
        return;
      }
      if(si>=0){
        if(!cs.s.includes(si))setSelection(t,[si],[]);
        const c2=curSel(t);startGroupDrag(c2.s,c2.p,q,e);
        return;
      }
      if(hit){
        if(cs.p.includes(hit.id)&&cs.s.length+cs.p.length>1){startGroupDrag(cs.s,cs.p,q,e);return}
        setSelection(t,[],[hit.id]);
        return;
      }
      if(!e.shiftKey)setSelection(t,[],[]);
      startMarquee(q,e,e.shiftKey?cs:null);
      return;
    }
    const p0=pos(e),p=NOSNAP.has(tool.name)?p0:snapP(p0);
    if(tool.name==='text'){
      const i=strokeAt(t,p0,2),s=i>=0?t.strokes[i]:null;
      if(s&&s.tool==='text')openText([s.x,s.y],{i,s});else openText(p);
      return;
    }
    commitText();
    try{dr.setPointerCapture(e.pointerId)}catch(err){}
    r.drawing=true;
    if(tool.name==='strokeEraser'){cur={tool:'del',refs:[]};delPushed=false;eraseAt(p0);return}
    cur={tool:tool.name,color:tool.color,size:tool.size,pts:[p]};
    if(cur.tool!=='pen'&&cur.tool!=='eraser')cur.pts.push(p);
    if(FILLABLE.has(cur.tool)&&tool.fill)cur.fill=tool.fill;
    if(LABELABLE.has(cur.tool)&&tool.label)cur.label=tool.label;
    if(cur.tool==='classBox')Object.assign(cur,{stereo:'',name:'ClassName',attrs:'- field: Type',meths:'+ method(): void',fs:16});
    if(cur.tool==='note')Object.assign(cur,{text:'메모',fs:16});
    t.strokes.push(cur);r.redo=[];redraw(t);
  };
  dr.onpointermove=e=>{
    if(e.pointerType==='touch'&&touches.has(e.pointerId)){
      touches.set(e.pointerId,[e.clientX,e.clientY]);
      if(pinch){
        if(touches.size>=2){
          const [a,b]=[...touches.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
          if(pinch.d>0&&d>0)zoomAt(t,d/pinch.d,mx,my);
          r.cx-=(mx-pinch.mx)/r.zoom;r.cy-=(my-pinch.my)/r.zoom;applyZoom(t);
          pinch.d=d;pinch.mx=mx;pinch.my=my;
        }
        return;
      }
    }
    updateCursor(e);
    if(pan){r.cx=pan.cx-(e.clientX-pan.x)/r.zoom;r.cy=pan.cy-(e.clientY-pan.y)/r.zoom;applyZoom(t);return}
    if(sdrag){moveStroke(pos(e));redraw(t);if(sdrag.hasPhoto)redrawBg(t);placePhotoBox(t);return}
    if(mq){moveMarquee(pos(e));return}
    if(!cur)return;
    const p0=pos(e),p=NOSNAP.has(cur.tool)?p0:snapP(p0);
    if(cur.tool==='del'){eraseAt(p0);return}
    if(cur.tool==='pen'||cur.tool==='eraser')cur.pts.push(p);else cur.pts[1]=p;
    redraw(t);
  };
  const end=()=>{
    if(pan){pan=null;sync();return}
    if(sdrag){sdrag=null;r.drawing=false;showGuides(null,null);save();return}
    if(mq){mq=null;r.drawing=false;$('#mbox').style.display='none';return}
    if(!cur)return;
    const c=cur;cur=null;r.drawing=false;save();
    if(LABELABLE.has(c.tool)&&tool.label){tool.label='';placePhotoBox(t)}   // 라벨은 선 하나에만 붙는다
    if(BOXED.has(c.tool)){const i=t.strokes.indexOf(c);if(i>=0)openDlg(i)}
  };
  const up=e=>{
    touches.delete(e.pointerId);
    if(pinch){if(touches.size<2)pinch=null;return}
    end();
  };
  dr.onpointerup=up;dr.onpointercancel=up;
  dr.onpointerleave=()=>{ecur.style.display='none'};
}

actions.newDraw=()=>newTab('draw');
const textUndo=actions.undo,textRedo=actions.redo;
actions.undo=()=>{
  const t=active();
  if(t.kind!=='draw'){textUndo();return}
  if(rt[t.id].drawing)return;
  if(t.strokes.length){rt[t.id].redo.push(t.strokes.pop());refresh(t);save()}
};
actions.redo=()=>{
  const t=active();
  if(t.kind!=='draw'){textRedo();return}
  const r=rt[t.id];
  if(r.drawing)return;
  if(r.redo.length){t.strokes.push(r.redo.pop());refresh(t);save()}
};
function zoomBy(f){
  const t=active();
  if(t.kind!=='draw'){flash('그림판에서만 확대/축소할 수 있습니다');return}
  const r=rt[t.id],b=$('#stage').getBoundingClientRect();
  zoomAt(t,f===0?1/r.zoom:f,b.left+b.width/2,b.top+b.height/2);
}
actions.clearAll=()=>{
  const t=active();
  if(t.kind!=='draw'){flash('그림판에서만 전체 지우기를 쓸 수 있습니다');return}
  const r=rt[t.id];
  if(r.drawing)return;
  const del=deletedSet(t),refs=[];
  t.strokes.forEach((s,i)=>{if(s.tool!=='del'&&s.tool!=='photoDel'&&!del.has(i))refs.push(i)});
  if(!refs.length){flash('지울 그림이 없습니다');return}
  t.strokes.push({tool:'del',refs});r.redo=[];redraw(t);save();
  flash('그림을 모두 지웠습니다 (Ctrl+Z로 되돌릴 수 있습니다)');
};
function setPhoto(t,sp,rect){Object.assign(sp,rect);redrawBg(t);placePhotoBox(t);save()}
actions.photoDelete=()=>{
  const t=active();
  if(t.kind!=='draw')return;
  const r=rt[t.id],sp=selPhoto(t);
  if(r.drawing)return;
  if(!sp){flash('삭제할 사진을 먼저 선택하세요');return}

// 선택 모드에서 고른 요소(획, 글자, 사진) 삭제
actions.selDelete=()=>{
  const t=active();
  if(t.kind!=='draw')return;
  const r=rt[t.id];
  if(r.drawing)return;
  const sel=curSel(t),n=sel.s.length+sel.p.length;
  if(!n){flash('삭제할 요소를 먼저 선택하세요');return}
  if(!sel.s.length&&sel.p.length===1){actions.photoDelete();return}
  // 여러 요소도 하나의 삭제 기록으로 남겨 Ctrl+Z 한 번에 되돌린다
  const rec={tool:'del',refs:sel.s};
  if(sel.p.length)rec.pids=sel.p;
  t.strokes.push(rec);r.redo=[];
  setSelection(t,[],[]);
  redraw(t);if(sel.p.length)redrawBg(t);save();
  flash(n+'개 요소를 삭제했습니다 (Ctrl+Z로 되돌릴 수 있습니다)');
};
document.addEventListener('keydown',e=>{
  if(e.key!=='Delete'||tool.name!=='select'||active().kind!=='draw')return;
  if(/^(TEXTAREA|INPUT)$/.test(e.target.tagName))return;
  e.preventDefault();actions.selDelete();
});

actions.zoomFit=()=>{
  const t=active();
  if(t.kind!=='draw'){flash('그림판에서만 화면 맞춤을 쓸 수 있습니다');return}
  fitView(t);applyZoom(t);
};
document.addEventListener('keydown',e=>{
  if(!e.ctrlKey||active().kind!=='draw'||/^(TEXTAREA|INPUT)$/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();actions.undo()}
  else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();actions.redo()}
  else if(k==='c'&&!e.shiftKey){if(copySel(false))e.preventDefault()}
  else if(k==='x'){if(copySel(true))e.preventDefault()}
  else if(k==='d'){e.preventDefault();if(copySel(false))pasteClip()}
  else if(k==='a'&&tool.name==='select'){
    // 전체 선택
    e.preventDefault();
    const t=active(),del=deletedSet(t),s=[];
    t.strokes.forEach((o,i)=>{if(!del.has(i)&&!['del','photoDel','eraser'].includes(o.tool))s.push(i)});
    setSelection(t,s,visiblePhotos(t).map(p=>p.id));
  }
});

// ---- 복사/붙여넣기 (선택 모드에서 고른 획이나 사진) ----
let clip=null;
function copySel(cut){
  const t=active();if(t.kind!=='draw')return false;
  const sel=curSel(t);
  const strokes=sel.s.map(i=>JSON.parse(JSON.stringify(t.strokes[i])));
  const photos=sel.p.map(id=>t.photos.find(p=>p.id===id)).filter(p=>p&&p.src).map(p=>({...p}));
  if(!strokes.length&&!photos.length){flash('복사할 요소를 먼저 선택하세요');return false}
  clip={strokes,photos,n:0};
  if(cut)actions.selDelete();else flash(strokes.length+photos.length+'개 요소를 복사했습니다 (Ctrl+V로 붙여넣기)');
  return true;
}
function pasteClip(){
  const t=active();if(t.kind!=='draw')return;
  if(!clip){flash('붙여넣을 요소가 없습니다');return}
  const r=rt[t.id];if(r.drawing)return;
  clip.n++;const off=20*clip.n;
  const ns=[],np=[];
  clip.strokes.forEach(c=>{
    const s=JSON.parse(JSON.stringify(c));shiftStroke(s,off,off);
    t.strokes.push(s);ns.push(t.strokes.length-1);
  });
  if(ns.length)r.redo=[];
  let nid=Math.max(0,...t.photos.map(p=>p.id));
  clip.photos.forEach(d=>{
    const id=++nid;
    t.photos.push({id,src:d.src,x:d.x+off,y:d.y+off,w:d.w,h:d.h});np.push(id);
    const im=new Image();im.onload=()=>{r.imgs[id]=im;redrawBg(t);placePhotoBox(t)};im.src=d.src;
  });
  const b=document.querySelector('[data-tool="select"]');
  if(tool.name!=='select'&&b)b.click();
  setSelection(t,ns,np);
  redraw(t);redrawBg(t);save();
}

// ---- 화살표 키 이동, Enter로 편집, Space로 화면 이동 ----
let spaceDown=false;
const inField=e=>/^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName);
document.addEventListener('keydown',e=>{
  const t=active();
  if(t.kind!=='draw'||inField(e)||e.ctrlKey||e.altKey||e.metaKey)return;
  if(e.code==='Space'){
    e.preventDefault();spaceDown=true;
    const d=$('#drc');if(d)d.style.cursor='grab';
    return;
  }
  if(e.key==='Home'&&e.target.tagName!=='BUTTON'){e.preventDefault();fitView(t);applyZoom(t);return}
  if(tool.name!=='select')return;
  const r=rt[t.id];if(r.drawing)return;
  if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){
    const si=selStrokeIdx(t);
    if(si>=0&&BOXED.has(t.strokes[si].tool)){e.preventDefault();r.openDlg(si)}
    return;
  }
  if(e.key==='Escape'){setSelection(t,[],[]);return}
  const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(!dir)return;
  const k=e.shiftKey?10:1,sel=curSel(t);
  if(!sel.s.length&&!sel.p.length){
    // 고른 요소가 없으면 방향키로 화면을 옮긴다 (Shift: 크게)
    const st=(e.shiftKey?300:80)/r.zoom;
    r.cx+=dir[0]*st;r.cy+=dir[1]*st;applyZoom(t);e.preventDefault();return;
  }
  sel.s.forEach(i=>shiftStroke(t.strokes[i],dir[0]*k,dir[1]*k));
  sel.p.forEach(id=>{const p=t.photos.find(q=>q.id===id);if(p){p.x+=dir[0]*k;p.y+=dir[1]*k}});
  redraw(t);if(sel.p.length)redrawBg(t);
  e.preventDefault();placePhotoBox(t);saveSoon();
});
document.addEventListener('keyup',e=>{
  if(e.code!=='Space'||!spaceDown)return;
  e.preventDefault();spaceDown=false;
  const t=active(),r=t&&rt[t.id];if(r&&r.sync)r.sync();
});
window.addEventListener('blur',()=>{spaceDown=false});
