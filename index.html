<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메모장 그림</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 한 줄 헤더 + 점 격자 작업 영역 위에 떠 있는 도구 모음, 속성 카드, 줌 바 */
:root{
  --bg:#f6f6fb;--surface:#ffffff;--text:#1b1b1f;--muted:#6b6b7b;--line:#e6e6f0;
  --accent:#6965db;--accent-soft:#e0dfff;--hover:#f1f0ff;--dot:#d9d9e6;--danger:#c42b1c;
  --shadow:0 2px 12px rgba(40,40,80,.12);
  --pad-l:228px;--pad-r:24px;--pad-t:68px;--pad-b:24px; /* 작업 영역 여백: 왼쪽 도구 상자와 위쪽 도구 모음 자리 + 약간의 여백 */
  --ui:"Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  --mono:'D2Coding','D2 Coding',Consolas,"Malgun Gothic",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161619;--surface:#232329;--text:#ececf1;--muted:#9a9aaa;--line:#34343d;
    --accent:#a8a5ff;--accent-soft:#403e6a;--hover:#2f2f3a;--dot:#2a2a33;--danger:#ff8a7a;
    --shadow:0 2px 14px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161619;--surface:#232329;--text:#ececf1;--muted:#9a9aaa;--line:#34343d;
  --accent:#a8a5ff;--accent-soft:#403e6a;--hover:#2f2f3a;--dot:#2a2a33;--danger:#ff8a7a;
  --shadow:0 2px 14px rgba(0,0,0,.5);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.45 var(--ui)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* 헤더: 메뉴 + 탭 + 테마 */
#header{position:relative;z-index:20;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
#menubar{display:flex;gap:2px;flex:none}
.menu{position:relative}
.menu>button,.menu .item{background:none;border:0;padding:6px 10px;cursor:pointer;text-align:left;border-radius:8px;white-space:nowrap}
.menu>button:hover,.menu .item:hover,.menu.open>button{background:var(--hover)}
.dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:30;flex-direction:column;box-shadow:var(--shadow)}
.menu.open .dropdown{display:flex}
#tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--accent-soft);color:var(--text);font-weight:500}
.tab .x{border:0;background:none;cursor:pointer;border-radius:6px;width:22px;height:22px;line-height:1;color:var(--muted)}
.tab .x:hover{background:rgba(128,128,128,.25);color:var(--text)}
#addmenu{flex:none;margin-left:-6px}
#addtab{font-size:18px;line-height:1;width:32px;height:32px;padding:0;text-align:center}
.tab input{font:inherit;width:12em;max-width:40vw;padding:1px 6px;border:1px solid var(--accent);border-radius:6px;background:var(--surface);color:var(--text)}
#theme,#aboutbtn{flex:none;width:34px;height:34px;padding:0;display:grid;place-items:center;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted)}
#theme:hover,#aboutbtn:hover{background:var(--hover);color:var(--text)}
#aboutmenu{flex:none}
#aboutmenu .dropdown,#keysmenu .dropdown{left:auto;right:0}
.keyspop{width:min(280px,calc(100vw - 24px))}
.keyspop .kt{margin:0 0 2px;font-size:13px;font-weight:700}
.keyspop dl.keys{margin:0 0 6px;gap:5px 12px}
.keyspop dt{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.keyspop kbd{font:600 11px/1 var(--ui);padding:3px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--bg);color:var(--text);white-space:nowrap}
.keyspop .kmore{margin:6px 0 0;font-size:12px;color:var(--muted)}
.about{width:min(300px,calc(100vw - 24px));padding:14px 16px;gap:6px;cursor:default;font-size:13px}
.about h2{margin:0 0 4px;font-size:15px}
.about dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.about dt{color:var(--muted)}
.about dd{margin:0}
.about h2.sub{margin:10px 0 2px;font-size:13px}
.about h3.kg{margin:12px 0 4px;font-size:12px;color:var(--accent);font-weight:700}
.about p.kn{margin:2px 0 0}
.about dl.keys dt{font-variant-numeric:tabular-nums;white-space:nowrap}
.about{max-height:calc(100vh - 80px);overflow-y:auto}
.about p{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
#theme .sun{display:none}
:root[data-theme="dark"] #theme .sun{display:block}
:root[data-theme="dark"] #theme .moon{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #theme .sun{display:block}
  :root:not([data-theme="light"]) #theme .moon{display:none}
}

/* 작업 영역 */
#main{position:relative;flex:1;min-height:0;display:flex;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:20px 20px}
#statusbar{display:flex;justify-content:space-between;gap:12px;padding:4px 14px;background:var(--surface);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#msg{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:9px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;text-align:center}
#msg:not(:empty){opacity:1}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}

/* 텍스트 탭: 종이 카드 */
.textwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.rtbar{flex:none;display:flex;align-items:center;gap:2px;padding:6px 10px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.rtbar::-webkit-scrollbar{display:none}
.rtbar button,.rtbar .rc{flex:none;min-width:34px;height:34px;padding:0 8px;border:0;background:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--text);font:inherit}
.rtbar button:hover,.rtbar .rc:hover{background:var(--hover)}
.rtbar button.on{background:var(--accent-soft);color:var(--accent)}
.rtbar .zp{min-width:56px;font-size:13px;font-variant-numeric:tabular-nums}
.rtbar .rs{flex:none;height:34px;max-width:104px;padding:0 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;margin:0 2px}
.rtbar .rc{position:relative;font-weight:700;align-content:center}
.rtbar .rc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.rtbar .rc i{display:block;width:16px;height:3px;border-radius:2px;margin-top:1px}
.rtbar [data-c=md],.rtbar [data-c=pdf]{display:flex;align-items:center;gap:3px}
.rtbar .mdl{font-size:11px;font-weight:700;letter-spacing:.02em}
.rtbar .rsep{flex:none;width:1px;height:22px;background:var(--line);margin:0 4px}
.seltb{position:fixed;z-index:30;display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.seltb[hidden]{display:none}
.seltb button{flex:none;min-width:30px;height:30px;padding:0 6px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--text);font:inherit;font-size:13px}
.seltb button:hover{background:var(--hover)}
.seltb .sw{min-width:0;width:22px;height:22px;margin:0 2px;padding:0;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.seltb .sw.hl{border-radius:5px}
.seltb .pal{position:relative;display:block;box-sizing:content-box;cursor:pointer;background:conic-gradient(#f03e3e,#fab005,#40c057,#228be6,#be4bdb,#f03e3e)}
.seltb .pal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.seltb .ssep{flex:none;width:1px;height:20px;background:var(--line);margin:0 3px}
.paper{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column}
.editor{position:relative;flex:1 0 auto;width:100%;max-width:960px;margin:0 auto;outline:0;background:var(--surface);color:var(--text);border-radius:14px;box-shadow:var(--shadow);padding:28px 32px;font:15px/1.6 var(--ui);white-space:pre-wrap;overflow-wrap:anywhere;caret-color:var(--accent)}
.editor:focus-visible{outline:2px solid var(--accent-soft)}
.editor p,.editor div{margin:0}
.editor h1{font-size:1.7em;margin:.3em 0;line-height:1.3}
.editor h2{font-size:1.4em;margin:.3em 0;line-height:1.3}
.editor h3{font-size:1.15em;margin:.3em 0;line-height:1.3}
.editor ul,.editor ol{margin:.2em 0;padding-left:1.6em}
.editor img{max-width:100%;height:auto;vertical-align:bottom;border-radius:6px;cursor:pointer}
.editor li img{vertical-align:top}
.imgov{position:fixed;z-index:25;pointer-events:none;border:2px solid var(--accent);border-radius:6px;box-sizing:border-box}
.imgov[hidden]{display:none}
.imgtb{position:absolute;left:-2px;bottom:calc(100% + 6px);display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:auto;white-space:nowrap}
.imgov.low .imgtb{bottom:auto;top:calc(100% + 6px)}
.imgtb button{height:28px;padding:0 8px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--text);font:inherit;font-size:12px}
.imgtb button:hover{background:var(--hover)}
.imgtb button[data-i=del]{color:#c42b1c}
.imgh{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:4px;background:var(--accent);border:2px solid var(--surface);cursor:nwse-resize;pointer-events:auto;touch-action:none}
.editor hr{border:0;border-top:1px solid var(--line);margin:.8em 0}
.editor pre.cb{position:relative;margin:.5em 0;padding:26px 14px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:13.5px/1.55 var(--mono);white-space:pre;overflow-x:auto;overflow-wrap:normal;tab-size:4;-moz-tab-size:4}
.editor pre.cb::before{content:'코드';position:absolute;left:12px;top:5px;font:600 10.5px/1 var(--ui);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;user-select:none;pointer-events:none}
.editor pre.cb[data-lang=java]::before{content:'JAVA'}
.editor pre.cb[data-lang=json]::before{content:'JSON'}
.cbdel{position:fixed;z-index:24;display:flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted);font:12px/1 var(--ui);cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.cbdel[hidden]{display:none}
.cbdel:hover{color:var(--danger);border-color:var(--danger)}
.cbdel .ico{width:14px;height:14px}
::highlight(cb-c){color:#6a737d;color:light-dark(#6a737d,#8b949e)}
::highlight(cb-s){color:#0a7a3b;color:light-dark(#0a7a3b,#7ee787)}
::highlight(cb-n){color:#b35900;color:light-dark(#b35900,#ffa657)}
::highlight(cb-k){color:#7a3ec8;color:light-dark(#7a3ec8,#d2a8ff)}
::highlight(cb-t){color:#0b6bcb;color:light-dark(#0b6bcb,#79c0ff)}
::highlight(cb-f){color:#a03a00;color:light-dark(#a03a00,#ffc799)}
.editor.empty::before{content:attr(data-ph);position:absolute;left:32px;top:28px;color:var(--muted);pointer-events:none}
.editor ul.todo{list-style:none;padding-left:1.7em}
.editor ul.todo>li{position:relative}
.editor ul.todo>li::before{content:'☐';position:absolute;left:-1.5em;cursor:pointer;color:var(--accent)}
.editor ul.todo>li.done::before{content:'☑'}
.editor ul.todo>li.done{color:var(--muted);text-decoration:line-through}
::highlight(find){background:#ffe58a;color:#000}
::highlight(findcur){background:#ff9f43;color:#000}

/* 코드 탭: 줄 번호가 있는 편집기. 글자는 투명한 입력 칸 뒤에 색칠한 층을 겹쳐 보여 준다 */
.codewrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);--cfs:14px}
.cedit{position:relative;flex:1;min-height:0;overflow:hidden;font:var(--cfs)/1.55 var(--mono);background:var(--surface)}
.cbar .rs[data-c="lang"]{max-width:190px}
.cbar .rs[data-c="sample"]{max-width:200px}
.cvbar .rs[data-v="entry"]{max-width:230px}
.csplit{flex:1;min-height:0;display:flex}
.csplit>.cedit{flex:1 1 0;min-width:0}
.csplitter{flex:none;width:7px;margin:0 -3px;cursor:col-resize;position:relative;z-index:4;touch-action:none}
.csplitter::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--line)}
.csplitter:hover::after{background:var(--accent);width:2px;left:2.5px}
.cview{flex:0 0 var(--vw,48%);min-width:0;display:flex;flex-direction:column;background:var(--surface)}
.noview .cview,.noview .csplitter{display:none}
.cvpane{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.cvpane[hidden]{display:none}
.cvtitle{flex:none;padding:0 8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.cvframe{background:#e9eaf2;display:flex;justify-content:center;overflow:auto}
.cvf{border:0;height:100%;width:100%;background:#fff;max-width:100%}
.cvf.dev{box-shadow:0 2px 14px rgba(0,0,0,.18)}
.cvout{overflow:auto;padding:10px 14px;background:#fff;color:#1b1b1f;font:13px/1.55 var(--mono)}
.ol{white-space:pre-wrap;overflow-wrap:anywhere;padding:2px 0;border-bottom:1px solid #f0f0f5}
.ol.warn{color:#9a6700;background:#fff8e1}
.ol.error{color:#c42b1c;background:#fff0ee}
.ol.sys{color:#6b6b7b;font-family:var(--ui);font-size:12px;border-bottom:0}
.cvbar .runbtn{color:#fff;background:var(--accent);font-weight:500}
.cvbar .runbtn:hover{background:var(--accent);filter:brightness(1.1)}
.cvtree{overflow:auto;padding:10px 14px;background:#fff;color:#1b1b1f;font:13px/1.7 var(--mono)}
.cvtree details>:not(summary){margin-left:20px}
.cvtree summary{cursor:pointer}
.jk{color:#0b6bcb}.jc{color:#888}.js{color:#0a7a3b}.jn{color:#b35900}.jb{color:#7a3ec8}.jm{color:#8a8a99;font-size:12px}
.jstat{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;font-size:13px;line-height:1.5;border-bottom:1px solid var(--line);background:var(--surface);color:var(--muted)}
.jstat.ok{background:#e8f6ec;color:#17692f}.jstat.bad{background:#fdecea;color:#b3261a}
.jstat button{border:1px solid currentColor;background:none;color:inherit;border-radius:6px;padding:1px 8px;cursor:pointer;font:inherit;font-size:12px}
.jstat .jw{color:#a15c00}
.rtbar.jconv .rs{max-width:140px}
.jconv .jroot{flex:none;width:96px;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;margin:0 2px}
.jmsg{font:14px/1.6 var(--ui);color:#6b6b7b;padding:10px 0}
.jmsg.bad{color:#c42b1c;background:#fff0ee;border-radius:10px;padding:10px 14px}
.jmsg.bad p{margin:6px 0}.jhelp{font-size:12px;color:#6b6b7b}
.jmsg .btn{display:inline-block;width:auto;padding:3px 10px;color:#1b1b1f}
.cvnone{display:grid;place-items:center;padding:24px;background:#fff;color:#1b1b1f}
.cvnone-in{max-width:340px;text-align:center;font-size:14px;line-height:1.6}
.cvnone-in p{margin:6px 0 14px;color:#6b6b7b}
.cvpick{display:grid;gap:8px}
.cvpick button{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border:1px solid #e6e6f0;border-radius:10px;background:#fff;color:#1b1b1f;cursor:pointer;font-weight:500}
.cvpick button:hover{background:#f1f0ff;border-color:#6965db}
.cvpick small{color:#6b6b7b;font-weight:400}
.cvbar{border-bottom:1px solid var(--line);flex-wrap:wrap;overflow:visible;row-gap:2px}   /* 좁아도 잘리지 않고 다음 줄로 넘어간다 */
.cvrel[hidden]{display:none}
.cvmore{margin-left:auto}
.cvmore>button{white-space:nowrap}
.cvmore .dropdown{left:auto;right:0;min-width:210px}
.cvmore .dropdown .item{place-items:center start;text-align:left}
.cvmore .dropdown .rs{max-width:none;margin:4px 0 0;width:100%}
.cvbar .rel{display:flex;align-items:center;gap:2px;padding:0 6px 0 2px}
.cvbar .rel svg{width:24px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cvbar .rel:not(.on){opacity:.55;text-decoration:line-through}
.cvinfo .ci-off{opacity:.45}
.cvinfo{position:absolute;right:8px;bottom:8px;max-width:min(440px,calc(100% - 16px));max-height:min(68%,340px);overflow:auto;background:rgba(255,255,255,.95);color:#222;border:1px solid var(--line);border-radius:10px;padding:5px 10px 6px;font-size:12px;line-height:1.4;box-shadow:var(--shadow)}
.cvinfo[hidden]{display:none}
.cvinfo .ci-h{margin:6px 0 2px;font-weight:700;color:#6965db}
.cvinfo .ci-h:first-child{margin-top:2px}
.cvinfo .ci-r{display:flex;align-items:center;gap:8px}
.cvinfo .ci-v{flex:none;width:30px;text-align:center;font-weight:700;letter-spacing:1px}
.cvinfo .ci-r svg{flex:none;width:30px;height:18px;fill:none;stroke:#222;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cvbar [hidden]{display:none}
.cvbar button[data-v="class"],.cvbar button[data-v="flow"]{font-weight:500}
.cvbody{position:relative;flex:1;min-height:0;background:#fff}
.cvc{position:absolute;left:0;top:0;cursor:grab;touch-action:none}
.cvc:active{cursor:grabbing}
.cvempty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#6b6b7b;font-size:14px;line-height:1.6;pointer-events:none}
.cvempty:empty{display:none}
@media (max-width:720px){
  .csplit{flex-direction:column}
  .cview{flex:0 0 50%}
  .csplitter{display:none}
}
.chl,.cta{position:absolute;left:0;top:0;margin:0;border:0;padding:12px 16px 40px 0;font:inherit;letter-spacing:0;tab-size:var(--tab,4);-moz-tab-size:var(--tab,4);white-space:pre;overflow-wrap:normal;word-break:normal}
.codewrap.wrap .chl,.codewrap.wrap .cta{white-space:pre-wrap;overflow-wrap:anywhere}
.chl{overflow:hidden;pointer-events:none;color:var(--text);counter-reset:ln}
.chl .l{position:relative;padding-left:60px;min-height:1.55em;counter-increment:ln}
.chl .l::before{content:counter(ln);position:absolute;left:0;width:46px;text-align:right;color:var(--muted);opacity:.65;user-select:none}
.cta{inset:0;width:100%;height:100%;padding-left:60px;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--text);resize:none;outline:0;overflow:auto;z-index:1}
.cta::selection{background:rgba(105,101,219,.35);-webkit-text-fill-color:transparent}
.cta::placeholder{color:transparent}
.tc{color:#6a737d;color:light-dark(#6a737d,#8b949e);font-style:italic}
.ts{color:#0a7a3b;color:light-dark(#0a7a3b,#7ee787)}
.tn{color:#b35900;color:light-dark(#b35900,#ffa657)}
.tk{color:#7a3ec8;color:light-dark(#7a3ec8,#d2a8ff);font-weight:500}
.tt{color:#0b6bcb;color:light-dark(#0b6bcb,#79c0ff)}
.tf{color:#a03a00;color:light-dark(#a03a00,#ffc799)}
.chint{position:absolute;left:60px;top:12px;right:16px;display:flex;flex-direction:column;gap:4px;color:var(--muted);font:14px/1.5 var(--ui);pointer-events:none;z-index:2}
.chint[hidden]{display:none}
.chint b{font-weight:500}
.chint span{font-size:12px;opacity:.85}
.cdrop{position:absolute;inset:8px;z-index:3;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,var(--accent));color:var(--accent);font-weight:500;pointer-events:none}
.cdrop[hidden]{display:none}
::highlight(cfind){background:#ffe58a;color:#000}
::highlight(cfindcur){background:#ff9f43;color:#000}

/* 그림 탭: 떠 있는 도구 모음, 속성 카드, 줌 바 */
#toolbar,#zoombar,#props{position:absolute;z-index:5;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
#toolbar{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;max-width:calc(100% - 16px);overflow-x:auto}
.tb{flex:none;min-width:36px;height:36px;padding:0 6px;border:0;background:none;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 4px}
#zoombar{left:16px;bottom:16px;display:flex;align-items:center;gap:2px;padding:4px}
#zoompct{min-width:56px;font-size:13px;font-variant-numeric:tabular-nums}
#props{left:16px;top:68px;width:196px;display:flex;flex-direction:column;gap:16px;padding:14px;max-height:calc(100% - 68px - 80px);overflow-y:auto}
#props label{display:block;margin-bottom:8px;font-size:12px;color:var(--muted)}
#props .sec{display:block}
#swatches{display:flex;align-items:center;gap:8px}
button.sw{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
button.sw.on{box-shadow:0 0 0 2px var(--accent)}
#tcolor{width:30px;height:30px;padding:3px;border:0;border-radius:50%;background:conic-gradient(#ff3b30,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff3b30);cursor:pointer}
#tcolor::-webkit-color-swatch-wrapper{padding:0}
#tcolor::-webkit-color-swatch{border:2px solid var(--surface);border-radius:50%}
#tcolor::-moz-color-swatch{border:2px solid var(--surface);border-radius:50%}
#tsize{width:100%;accent-color:var(--accent)}
#photoctl{display:none;flex-direction:column;gap:8px}
#photoinfo{font-size:12px;color:var(--muted)}
.btn{display:block;width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;text-align:center}
.btn:hover{background:var(--hover);border-color:var(--accent-soft)}
#props .acts{display:flex;flex-direction:column;gap:8px}
/* 끝없이 넓은 작업 영역: 화면 크기의 캔버스를 쓰고, 끌거나 휠을 돌려 화면만 옮긴다 */
#stage{flex:1;min-width:0;position:relative;overflow:hidden;background:#fff;margin-left:228px}   /* 왼쪽 속성 카드 자리는 비워 두고, 캔버스는 그 오른쪽에서 시작한다 */
#view{position:absolute;inset:0;overflow:hidden}
#view canvas{position:absolute;left:0;top:0;touch-action:none}
#board{position:absolute;left:0;top:0;width:0;height:0;overflow:visible}
/* 자동 스크롤바: 그림이 화면 밖으로 넘어간 방향에만 나타난다 */
.sb{position:absolute;z-index:4;background:rgba(60,60,90,.06);touch-action:none}
.sb[hidden],.edge[hidden],#backbtn[hidden]{display:none}
#sbv{right:0;top:0;bottom:0;width:14px}
#sbh{left:0;right:0;bottom:0;height:14px}
.sb i{position:absolute;border-radius:7px;background:rgba(70,70,100,.38)}
.sb:hover i,.sb.on i{background:rgba(70,70,100,.62)}
#sbv i{left:3px;right:3px}
#sbh i{top:3px;bottom:3px}
/* 화면 밖에 그림이 더 있을 때 그 방향 가장자리에 뜨는 이동 버튼 */
.edge{position:absolute;z-index:4;width:36px;height:36px;padding:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--accent);box-shadow:var(--shadow);cursor:pointer}
.edge:hover{background:var(--accent-soft)}
.edge[data-e=l]{left:16px;top:50%;margin-top:-18px}
.edge[data-e=r]{right:24px;top:50%;margin-top:-18px}
.edge[data-e=u]{top:76px;left:50%;margin-left:-18px}
.edge[data-e=d]{bottom:76px;left:50%;margin-left:-18px}
#backbtn{position:absolute;z-index:4;left:50%;bottom:76px;transform:translateX(-50%);padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--accent);box-shadow:var(--shadow);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
#backbtn:hover{background:var(--accent-soft)}
#drc{cursor:crosshair}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;color:#a9a9bd;font-size:15px;line-height:1.8;padding:24px}
.textbox{position:absolute;margin:0;padding:0;border:0;outline:1px dashed var(--accent);background:transparent;resize:none;overflow:hidden;white-space:pre;z-index:5}
#ecur{position:absolute;display:none;pointer-events:none;border:1px solid #000;box-shadow:0 0 0 1px #fff;border-radius:50%;transform:translate(-50%,-50%);z-index:4}
#sbox{position:absolute;display:none;pointer-events:none;border:1px dashed var(--accent);outline:1px solid #fff;z-index:3}
#pbox{position:absolute;display:none;border:1px solid var(--accent);outline:1px solid #fff;cursor:move;z-index:3;touch-action:none}
#pbox i{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--accent);border-radius:3px;margin:-6px 0 0 -6px}
#pbox i[data-h=nw]{left:0;top:0;cursor:nwse-resize}
#pbox i[data-h=n]{left:50%;top:0;cursor:ns-resize}
#pbox i[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
#pbox i[data-h=e]{left:100%;top:50%;cursor:ew-resize}
#pbox i[data-h=se]{left:100%;top:100%;cursor:nwse-resize}
#pbox i[data-h=s]{left:50%;top:100%;cursor:ns-resize}
#pbox i[data-h=sw]{left:0;top:100%;cursor:nesw-resize}
#pbox i[data-h=w]{left:0;top:50%;cursor:ew-resize}

/* 격자, 정렬 안내선, 채우기 색, 라벨 입력 */
#gridov{position:absolute;inset:0;display:none;pointer-events:none;background-image:linear-gradient(to right,rgba(60,60,120,.16) 1px,transparent 1px),linear-gradient(to bottom,rgba(60,60,120,.16) 1px,transparent 1px)}
#view.grid #gridov{display:block}
.guide{position:absolute;display:none;pointer-events:none;z-index:4}
#gv{top:-50000px;height:100000px;width:0;border-left:1px dashed #e0457b}
#gh{left:-50000px;width:100000px;height:0;border-top:1px dashed #e0457b}
#fills{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button.fl{width:24px;height:24px;padding:0;border-radius:6px;border:1px solid var(--line);cursor:pointer}
button.fl.on{box-shadow:0 0 0 2px var(--accent)}
button.fl.none{background:linear-gradient(135deg,transparent 44%,var(--danger) 44%,var(--danger) 56%,transparent 56%),var(--surface)}
#fcolor{width:26px;height:26px;padding:3px;border:0;border-radius:50%;background:conic-gradient(#ff3b30,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff3b30);cursor:pointer}
#fcolor::-webkit-color-swatch-wrapper{padding:0}
#fcolor::-webkit-color-swatch{border:2px solid var(--surface);border-radius:50%}
#fcolor::-moz-color-swatch{border:2px solid var(--surface);border-radius:50%}
.txt{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
#mbox{position:absolute;display:none;pointer-events:none;border:1px solid var(--accent);background:rgba(105,101,219,.12);z-index:4}
#msel{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
#msel .mi{position:absolute;border:1px dashed var(--accent);outline:1px solid #fff}
.tab.dragging{opacity:.45}
.tab.dropat{box-shadow:inset 3px 0 0 var(--accent)}

/* 클래스 상자/메모 편집 창, 찾기 바 */
.clsdlg{position:absolute;right:16px;top:68px;width:272px;max-height:calc(100% - 84px);overflow-y:auto;z-index:8;display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.clsdlg h3{margin:0;font-size:14px}
.clsdlg label{display:block;font-size:12px;color:var(--muted)}
.clsdlg label>*{display:block;margin-top:4px;width:100%;color:var(--text)}
.clsdlg textarea,.clsdlg input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:13px/1.4 var(--mono)}
.clsdlg textarea{resize:vertical}
.clsdlg .row{display:flex;gap:8px}
.findbar{position:absolute;top:56px;right:16px;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100% - 32px);padding:8px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);font-size:13px}
.findbar[hidden]{display:none}
.findbar input[type=text]{width:130px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
.findbar .btn{display:inline-block;width:auto;padding:4px 10px}
.findbar .cnt{min-width:36px;color:var(--muted);font-size:12px}
.findbar label{display:flex;align-items:center;gap:4px;color:var(--muted);white-space:nowrap}

/* 탭 줄 가장자리 페이드(스크롤 힌트), 탭 목록 버튼 */
#tabs{scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#tabs::-webkit-scrollbar{display:none}
#tabs.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px);mask-image:linear-gradient(to right,transparent,#000 28px)}
#tabs.fade-r{-webkit-mask-image:linear-gradient(to left,transparent,#000 28px);mask-image:linear-gradient(to left,transparent,#000 28px)}
#tabs.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.tab span{max-width:42vw;overflow:hidden;text-overflow:ellipsis}
#tablist{display:block;flex:none}
#tablist .dropdown{left:auto;right:0;max-height:60vh;overflow-y:auto;min-width:220px}
#tablist .item{display:flex;gap:8px;align-items:center;width:100%}
#tablist .item.on{color:var(--accent);font-weight:500}
#tablist .item small{color:var(--muted);font-weight:400}
.dropdown{max-width:calc(100vw - 16px)}
html{touch-action:manipulation}
#view,#board,#toolbar,#zoombar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* 터치 기기: 누르기 쉽게 크게 */
@media (pointer:coarse){
  .menu>button,.menu .item{padding:10px 12px}
  .tab{padding:8px 6px 8px 14px}
  .tab .x{width:30px;height:30px}
  #theme,#aboutbtn{width:40px;height:40px}
  #addtab{width:40px;height:40px}
  .tb{min-width:44px;height:44px}
  #sbv{width:18px}#sbh{height:18px}
  .sb i{border-radius:9px}
  .edge{width:44px;height:44px;margin-top:0}
  button.sw{width:34px;height:34px}
  button.fl{width:30px;height:30px}
  .btn{padding:11px 10px}
  #pbox i{width:18px;height:18px;margin:-9px 0 0 -9px}
  #tsize{height:28px}
}

/* 좁은 화면: 속성 카드는 도구 모음 아래 가로 한 줄 */
@media (max-width:720px){
  /* 헤더는 두 줄: 위는 메뉴와 버튼, 아래는 탭 줄(옆으로 밀어서 넘김) */
  #header{flex-wrap:wrap;gap:2px 4px;padding:max(6px,env(safe-area-inset-top)) 8px 4px}
  #menubar{order:1}
  #addmenu{order:2;margin-left:0}
  #tablist{order:3;display:block;margin-left:auto}
  #theme{order:4}
  #aboutmenu{order:5}
  #tabs{order:6;flex:1 0 100%;padding:2px 0 4px;scroll-snap-type:x proximity}
  .tab{scroll-snap-align:start;padding:8px 6px 8px 14px}
  #props{left:8px;right:8px;top:68px;width:auto;flex-direction:row;align-items:center;gap:18px;padding:10px 12px;max-height:none;overflow-x:auto;overflow-y:hidden}
  #props .sec,#props #photoctl,#props .acts{flex:none}
  #props label{margin-bottom:4px}
  #props .acts{flex-direction:row}
  #props .btn{white-space:nowrap;width:auto;padding:8px 14px}
  #fills{flex-wrap:nowrap}
  /* 가로로 밀어서 보는 막대: 스크롤바는 숨기고 가장자리 그림자로 더 있음을 알린다 */
  #toolbar,#props,#zoombar{scrollbar-width:none;overscroll-behavior:contain}
  #toolbar::-webkit-scrollbar,#props::-webkit-scrollbar,#zoombar::-webkit-scrollbar{display:none}
  #toolbar,#props{
    background:linear-gradient(to right,var(--surface) 30%,transparent) left center,linear-gradient(to left,var(--surface) 30%,transparent) right center,
      radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.28),transparent) left center,radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.28),transparent) right center;
    background-color:var(--surface);background-repeat:no-repeat;background-size:28px 100%,28px 100%,10px 100%,10px 100%;
    background-attachment:local,local,scroll,scroll;
  }
  :root{--pad-l:12px;--pad-r:12px;--pad-t:148px;--pad-b:72px}
  #zoombar{left:8px;bottom:8px;max-width:calc(100% - 16px);overflow-x:auto}
  #stage{margin-left:0}
  .edge[data-e=l]{left:12px;top:50%;margin-top:-22px}
  .edge[data-e=r]{right:24px;margin-top:-22px}
  .edge[data-e=u]{top:156px;left:50%;margin-left:-22px}
  .edge[data-e=d]{bottom:76px;left:50%;margin-left:-22px}
  #backbtn{left:50%;bottom:84px}
  .paper{padding:8px}
  .editor{padding:16px;border-radius:12px;font-size:16px}
  .editor.empty::before{left:16px;top:16px}
  .rtbar{padding:6px 8px}
  .clsdlg{position:fixed;left:8px;right:8px;top:auto;bottom:40px;width:auto;max-height:46vh;z-index:30;gap:6px;padding:12px}
  .clsdlg textarea{height:54px;min-height:0}
  .findbar{left:8px;right:8px;max-width:none}
  .findbar input[type=text]{flex:1 1 120px;width:auto}
  .txt,.clsdlg input,.clsdlg textarea,.dims input,.tab input,.findbar input[type=text]{font-size:16px}
  #msg{bottom:48px}
}
</style>
</head>
<body>
<header id="header">
  <div id="menubar">
    <div class="menu"><button title="파일">파일</button><div class="dropdown">
      <button class="item" data-act="newText">새 메모장</button>
      <button class="item" data-act="newDraw">새 그림판</button>
      <button class="item" data-act="newCode">새 코드</button>
      <button class="item" data-act="open">열기… (Ctrl+O)</button>
      <button class="item" data-act="openCode">코드 파일 열기…</button>
      <button class="item" data-act="openPhoto">사진 열기…</button>
      <button class="item" data-act="save">저장 (Ctrl+S)</button>
      <button class="item" data-act="saveHtml">서식 포함 저장 (.html)</button>
      <button class="item" data-act="saveMd">마크다운으로 내보내기 (.md)</button>
      <button class="item" data-act="savePdf">PDF로 내보내기 (.pdf)</button>
      <button class="item" data-act="exportPng">PNG로 내보내기</button>
      <button class="item" data-act="copyPng">PNG를 클립보드로 복사</button>
      <button class="item" data-act="saveProject">프로젝트 저장 (Ctrl+Shift+S)</button>
      <button class="item" data-act="rename">이름 바꾸기 (F2)</button>
    </div></div>
    <div class="menu"><button title="편집">편집</button><div class="dropdown">
      <button class="item" data-act="undo">실행 취소 (Ctrl+Z)</button>
      <button class="item" data-act="redo">다시 실행 (Ctrl+Y)</button>
      <button class="item" data-act="cut">잘라내기 (Ctrl+X)</button>
      <button class="item" data-act="copy">복사 (Ctrl+C)</button>
      <button class="item" data-act="paste">붙여넣기 (Ctrl+V)</button>
      <button class="item" data-act="find">찾기/바꾸기 (Ctrl+F)</button>
      <button class="item" data-act="clearAll">전체 지우기 (그림)</button>
    </div></div>
    <div class="menu"><button title="보기">보기</button><div class="dropdown">
      <button class="item" data-act="zoomIn">확대</button>
      <button class="item" data-act="zoomOut">축소</button>
      <button class="item" data-act="zoomReset">100%</button>
      <button class="item" data-act="zoomFit">화면에 맞추기</button>
      <button class="item" data-act="toggleSnap">격자 맞춤 켜기/끄기</button>
    </div></div>
  </div>
  <div class="menu" id="addmenu"><button id="addtab" title="새로 만들기" aria-label="새로 만들기">+</button><div class="dropdown">
    <button class="item" data-act="newText">메모장</button>
    <button class="item" data-act="newDraw">그림판</button>
    <button class="item" data-act="newCode">코드</button>
  </div></div>
  <div id="tabs" role="tablist"></div>
  <div class="menu" id="tablist"><button id="tablistbtn" title="열린 목록" aria-label="열린 목록 보기">
    <svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button><div class="dropdown" id="tablistdd"></div></div>
  <button id="theme" title="라이트/다크 전환" aria-label="라이트/다크 전환">
    <svg class="ico moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="ico sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div class="menu" id="keysmenu"><button id="keysbtn" title="단축키" aria-label="단축키 보기">
    <svg class="ico" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
  </button><div class="dropdown about keyspop" role="dialog" aria-label="자주 쓰는 단축키"></div></div>
  <div class="menu" id="aboutmenu"><button id="aboutbtn" title="정보" aria-label="라이선스 및 제작자 정보">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".6"/></svg>
  </button><div class="dropdown about" role="dialog" aria-label="정보">

    <p>이 소프트웨어는 MIT 라이선스에 따라 누구나 자유롭게 사용, 복사, 수정, 배포할 수 있으며, 어떠한 보증도 제공되지 않습니다.</p>
    <p>글꼴: Noto Sans KR (SIL Open Font License 1.1)</p>
  </div></div>
</header>
<div id="main"></div>
<div id="statusbar"><span id="st-left"></span><span id="msg" role="status"></span><span id="st-right"></span></div>

<script>
// ---- state & utils ----
const KEY='notepad-paint-v1';
const MAX_BYTES=20*1024*1024;
let tabs=[],activeId=null,nextId=1;
const rt={};
let memoDrag=null;   // 메모 안에서 끌고 있는 이미지 (밖에서 끌어 온 파일과 구분한다)
const actions={};
const $=s=>document.querySelector(s);
const active=()=>tabs.find(t=>t.id===activeId);
let msgTimer;
function flash(text){const m=$('#msg');m.textContent=text;clearTimeout(msgTimer);msgTimer=setTimeout(()=>{m.textContent=''},4000)}
function setStatus(l,r){$('#st-left').textContent=l;$('#st-right').textContent=r}
function run(name,arg){const fn=actions[name];if(fn)fn(arg);else flash('아직 지원하지 않는 기능입니다')}
function save(){
  const build=full=>JSON.stringify({tabs:tabs.map(t=>full?t:t.kind==='draw'?{...t,photos:t.photos.map(p=>({...p,src:null}))}:t.kind==='text'?{...t,html:(t.html||'').replace(/<img[^>]*>/g,'')}:t),activeId,nextId});
  try{localStorage.setItem(KEY,build(true))}
  catch(e){
    try{localStorage.setItem(KEY,build(false));flash('저장 공간이 부족해 사진은 임시 저장에서 제외됩니다')}
    catch(e2){flash('저장 공간이 부족해 임시 저장을 건너뜁니다')}
  }
}
let saveTimer;
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,400)}
window.addEventListener('pagehide',()=>{if(saveTimer){clearTimeout(saveTimer);save()}});
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    const ok=d&&Array.isArray(d.tabs)?d.tabs.map(cleanTab).filter(Boolean):[];
    if(ok.length){
      tabs=ok;nextId=Math.max(1,...tabs.map(t=>t.id+1));
      activeId=tabs.some(t=>t.id===d.activeId)?d.activeId:tabs[0].id;
      return;
    }
  }catch(e){}
  // 처음 접속하면 메모장, 그림판, 코드를 하나씩 열어 두고, 메모장을 보여 준다
  tabs=[];newTab('text');newTab('draw');newTab('code');
  activeId=tabs[0].id;
}
function cleanTab(t){
  if(!t||typeof t!=='object'||!Number.isInteger(t.id)||t.id<1)return null;
  const title=typeof t.title==='string'?t.title:'메모장 '+t.id;
  const def=typeof t.def==='string'?t.def:t.kind==='draw'?'그림 '+t.id:'제목 없음 '+t.id;
  const custom=typeof t.custom==='boolean'?t.custom:!/^(메모장|그림판|코드|제목 없음|그림|탭) \d+$/.test(title);
  if(t.kind==='text'){
    const text=typeof t.text==='string'?t.text:'';
    // 서식 있는 내용은 허용 목록으로 걸러서 읽는다 (예전에 저장한 글자만 있는 메모는 문단으로 바꾼다)
    const html=typeof t.html==='string'?sanitizeHtml(t.html):textToHtml(text);
    const zoom=Number.isFinite(t.zoom)&&t.zoom>=0.5&&t.zoom<=3?t.zoom:1;
    return{id:t.id,kind:'text',title,def,custom,text,html,zoom};
  }
  if(t.kind==='code'){
    const code=typeof t.code==='string'?t.code:'';
    const lang=t.lang==='auto'||(CL[t.lang]&&t.lang!=='plain')?t.lang:'auto';
    const tab=[0,2,4,8].includes(t.tab)?t.tab:4;
    const fs=Number.isFinite(t.fs)&&t.fs>=10&&t.fs<=28?Math.round(t.fs):14;
    const vw=Number.isFinite(t.vw)&&t.vw>=25&&t.vw<=75?t.vw:48;
    return{id:t.id,kind:'code',title,def,custom,code,lang,tab,fs,wrap:t.wrap===true,eol:t.eol==='crlf'?'crlf':'lf',
      view:t.view!==false,vw,vmode:t.vmode==='flow'?'flow':'class',pv:['tablet','mobile'].includes(t.pv)?t.pv:'full',pauto:t.pauto!==false,csample:['form','card'].includes(t.csample)?t.csample:'doc',entry:typeof t.entry==='string'?t.entry.slice(0,120):'',hideAcc:t.hideAcc===true,dep:t.dep!==false,assoc:t.assoc!==false,agg:t.agg!==false,comp:t.comp!==false,legend:t.legend!==false,inh:t.inh!==false,impl:t.impl!==false,compact:t.compact===true,focus:t.focus===true};
  }
  if(t.kind==='draw'){
    const dim=v=>Number.isInteger(v)&&v>=1&&v<=4000;
    const okPt=p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite);
    const okStroke=s=>{
      if(!s||typeof s!=='object')return false;
      if(s.tool==='del')return Array.isArray(s.refs)&&s.refs.every(Number.isInteger)&&(s.pids===undefined||Array.isArray(s.pids)&&s.pids.every(Number.isInteger));
      if(s.tool==='photoDel')return Number.isInteger(s.id);
      if(s.tool==='text')return typeof s.text==='string'&&typeof s.color==='string'&&Number.isFinite(s.x)&&Number.isFinite(s.y)&&Number.isFinite(s.size)&&s.size>0;
      return Array.isArray(s.pts)&&s.pts.length>0&&s.pts.every(okPt);
    };
    const raw=Array.isArray(t.strokes)?t.strokes:[];
    const strokes=raw.every(okStroke)?raw:raw.filter(okStroke).filter(s=>s.tool!=='del');
    const w=dim(t.w)?t.w:800,h=dim(t.h)?t.h:600;
    const okRect=q=>q&&[q.x,q.y,q.w,q.h].every(Number.isFinite)&&q.w>=1&&q.h>=1;
    let photos=(Array.isArray(t.photos)?t.photos:[]).filter(p=>p&&Number.isInteger(p.id)&&okRect(p))
      .map(p=>({id:p.id,src:typeof p.src==='string'?p.src:null,x:p.x,y:p.y,w:p.w,h:p.h}));
    if(!photos.length&&typeof t.bg==='string'){
      const q=okRect(t.photo)?t.photo:{x:0,y:0,w,h};
      photos=[{id:1,src:t.bg,x:q.x,y:q.y,w:q.w,h:q.h}];
    }
    return{id:t.id,kind:'draw',title,def,custom,photos,strokes};
  }
  return null;
}
function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function pick(accept){
  const f=$('#filein');f.accept=accept;
  f.onchange=()=>{if(f.files[0])openFile(f.files[0]);f.value=''};
  f.click();
}

// ---- tabs ----
function freeTitle(base){
  const used=new Set(tabs.map(t=>{const m=(t.def||t.title).match(/^(.*) (\d+)$/);return m&&m[1]===base?+m[2]:0}));
  let n=1;while(used.has(n))n++;
  return base+' '+n;
}
function newTab(kind){
  if(!tabs.length)nextId=1;
  const id=nextId++;
  const def=freeTitle(kind==='draw'?'그림판':kind==='code'?'코드':'메모장');
  const t=kind==='draw'
    ?{id,kind:'draw',title:def,def,custom:false,photos:[],strokes:[]}
    :kind==='code'
    ?{id,kind:'code',title:def,def,custom:false,code:'',lang:'auto',tab:4,fs:14,wrap:false,eol:'lf',view:true,vw:48,vmode:'class',pv:'full',pauto:true,csample:'doc',entry:'',hideAcc:false,dep:true,assoc:true,agg:true,comp:true,legend:true,inh:true,impl:true,compact:false,focus:false}
    :{id,kind:'text',title:def,def,custom:false,text:'',html:'',zoom:1};
  tabs.push(t);activeId=id;render();
  save();
}
let dragTab=null;
function hasContent(t){
  if(t.kind==='text')return t.text.trim()!==''||/<img\b/.test(t.html||'');
  if(t.kind==='code')return t.code.trim()!=='';
  const d=deletedSet(t);
  return t.strokes.some((s,i)=>s.tool!=='del'&&s.tool!=='photoDel'&&!d.has(i))||visiblePhotos(t).length>0;
}
function closeTab(id){
  const i=tabs.findIndex(t=>t.id===id);if(i<0)return;
  tabs.splice(i,1);delete rt[id];
  if(!tabs.length){newTab('text');return}
  if(activeId===id)activeId=tabs[Math.max(0,i-1)].id;
  render();save();
}
// 텍스트 탭 제목: 직접 바꾸지 않았다면 첫 줄 내용이 제목이 된다 (내용이 없으면 기본 제목)
function autoTitle(t){
  const line=(t.text.split('\n').find(l=>l.trim())||'').trim();
  const clean=line.replace(/^(?:[•☐☑]|\d+\.)\s+/,'');
  return clean?(clean.length>20?clean.slice(0,20)+'…':clean):t.def;
}
function refreshTitle(t){
  if(t.custom||t.kind!=='text')return;
  const n=autoTitle(t);
  if(n===t.title)return;
  t.title=n;renderTabs();
}
function renameTab(id){
  const t=tabs.find(x=>x.id===id);if(!t)return;
  const el=$('#tabs [data-id="'+id+'"]');if(!el)return;
  const inp=document.createElement('input');
  inp.type='text';inp.value=t.title;inp.maxLength=40;inp.setAttribute('aria-label','이름');
  let done=false;
  const finish=ok=>{
    if(done)return;done=true;
    if(ok){
      const v=inp.value.trim();
      if(v){t.title=v;t.custom=true}
      else{t.custom=false;t.title=t.kind==='text'?autoTitle(t):t.def}
      save();
    }
    renderTabs();
    const r=rt[t.id];if(t.id===activeId&&r&&r.ta)r.ta.focus();
  };
  inp.onkeydown=e=>{
    e.stopPropagation();
    if(e.key==='Enter'){e.preventDefault();finish(true)}
    else if(e.key==='Escape'){e.preventDefault();finish(false)}
  };
  inp.onblur=()=>finish(true);
  inp.onclick=e=>e.stopPropagation();
  el.draggable=false;
  el.querySelector('span').replaceWith(inp);
  inp.focus();inp.select();
}
function render(){
  renderTabs();
  const main=$('#main');main.innerHTML='';
  const t=active();
  if(t.kind==='text')renderText(t,main);else if(t.kind==='code')renderCode(t,main);else renderDraw(t,main);
}
function renderTabs(){
  const bar=$('#tabs');bar.innerHTML='';
  for(const t of tabs){
    const el=document.createElement('div');el.className='tab'+(t.id===activeId?' active':'');el.dataset.id=t.id;
    const name=document.createElement('span');name.textContent=t.title;
    const x=document.createElement('button');x.className='x';x.textContent='✕';x.title='닫기';
    x.onclick=e=>{
      e.stopPropagation();
      if(hasContent(t)&&!confirm('"'+t.title+'"에 내용이 있습니다.\n닫으면 내용이 사라집니다. 닫을까요?'))return;
      closeTab(t.id);
    };
    // 끌어서 탭 순서 바꾸기
    el.draggable=true;
    el.ondragstart=e=>{dragTab=t.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','tab:'+t.id);el.classList.add('dragging')};
    el.ondragend=()=>{dragTab=null;el.classList.remove('dragging');bar.querySelectorAll('.dropat').forEach(x=>x.classList.remove('dropat'))};
    el.ondragover=e=>{if(dragTab!==null&&dragTab!==t.id){e.preventDefault();e.dataTransfer.dropEffect='move';el.classList.add('dropat')}};
    el.ondragleave=()=>el.classList.remove('dropat');
    el.ondrop=e=>{
      if(dragTab===null||dragTab===t.id)return;
      e.preventDefault();
      const from=tabs.findIndex(x=>x.id===dragTab),to=tabs.findIndex(x=>x.id===t.id);
      if(from<0||to<0)return;
      tabs.splice(to,0,tabs.splice(from,1)[0]);
      dragTab=null;renderTabs();save();
    };
    el.onclick=()=>{if(t.id===activeId)return;activeId=t.id;render();save()};
    el.tabIndex=0;el.setAttribute('role','tab');el.setAttribute('aria-selected',t.id===activeId);
    el.onkeydown=e=>{if(e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.click()}};
    el.title='더블클릭하거나 F2를 눌러 이름 바꾸기';
    el.append(name,x);bar.append(el);
  }
  // 탭 목록 메뉴(좁은 화면에서 보이는 버튼)
  const dd=$('#tablistdd');dd.innerHTML='';
  for(const t of tabs){
    const it=document.createElement('button');it.className='item'+(t.id===activeId?' on':'');it.dataset.tab=t.id;
    const nm=document.createElement('span');nm.textContent=(t.id===activeId?'✓ ':'')+t.title;
    const kd=document.createElement('small');kd.textContent=t.kind==='draw'?'그림':t.kind==='code'?'코드':'메모';
    it.append(nm,kd);dd.append(it);
  }
  const a=bar.querySelector('.tab.active');
  if(a){
    const m=36,l=a.offsetLeft-bar.offsetLeft,r=l+a.offsetWidth;   // 가장자리 흐림 때문에 조금 여유를 둔다
    if(l-m<bar.scrollLeft)bar.scrollLeft=Math.max(0,l-m);
    else if(r+m>bar.scrollLeft+bar.clientWidth)bar.scrollLeft=r+m-bar.clientWidth;
  }
  $('#tablistbtn').title='열린 목록 ('+tabs.length+'개)';
  updateTabsFade();
}
// 탭 줄이 좌우로 더 있으면 가장자리를 흐리게 해서 밀어 볼 수 있음을 알린다
function updateTabsFade(){
  const b=$('#tabs');
  b.classList.toggle('fade-l',b.scrollLeft>2);
  b.classList.toggle('fade-r',b.scrollLeft+b.clientWidth<b.scrollWidth-2);
}
$('#tabs').addEventListener('scroll',updateTabsFade,{passive:true});
$('#tabs').addEventListener('wheel',e=>{
  const b=e.currentTarget;
  if(e.ctrlKey||b.scrollWidth<=b.clientWidth||Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
  e.preventDefault();b.scrollLeft+=e.deltaY;
},{passive:false});
// 탭 목록을 열면 지금 탭이 보이는 자리로 맞춘다
$('#tablistbtn').addEventListener('click',()=>setTimeout(()=>{const on=$('#tablistdd .on');if(on)on.scrollIntoView({block:'center'})},0));
window.addEventListener('resize',updateTabsFade);
$('#tabs').addEventListener('dblclick',e=>{
  const el=e.target.closest('.tab');
  if(el&&!e.target.closest('.x,input'))renameTab(+el.dataset.id);
});

// ---- text tab (서식 있는 메모장) ----
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function textToHtml(text){
  return String(text).replace(/\r\n?/g,'\n').split('\n').map(l=>l===''?'<p><br></p>':'<p>'+esc(l)+'</p>').join('');
}
// 붙여넣기/불러오기 HTML을 허용 목록으로 걸러 새로 만든다 (스크립트, 바깥 주소 이미지, 이벤트 속성 등은 모두 버린다)
const OK_TAGS=new Set(['B','U','S','SPAN','P','DIV','BR','UL','OL','LI','H1','H2','H3','HR']);
const TAG_ALIAS={STRONG:'B',EM:'I',STRIKE:'S',DEL:'S',INS:'U'};
const BLOCK_TAGS=new Set(['P','DIV','LI','H1','H2','H3','UL','OL','PRE']);
// 코드 블록(<pre>) 안의 글을 줄바꿈 포함 문자열로 읽는다. segs는 글 조각(노드)과 문자열 안의 시작 위치
// 브라우저가 줄바꿈 자리에 넣는 <br>와 글 안의 \n 을 모두 한 줄 바꿈으로 본다 (맨 끝 <br>는 빈 줄 표시용이라 뺀다)
function preMap(pre){
  let s='';const segs=[];
  const walk=n=>{
    for(const c of n.childNodes){
      if(c.nodeType===3){segs.push([c,s.length]);s+=c.nodeValue}
      else if(c.nodeType===1){
        if(c.tagName==='BR')s+='\n';
        else{walk(c);if((c.tagName==='DIV'||c.tagName==='P')&&s&&!s.endsWith('\n'))s+='\n'}
      }
    }
  };
  walk(pre);
  let l=pre;while(l.lastChild)l=l.lastChild;
  if(l.tagName==='BR'&&s.endsWith('\n'))s=s.slice(0,-1);
  return{s,segs};
}
const preText=pre=>preMap(pre).s;
const CODE_LANGS=['java','json','generic'];
const codeLangOf=(text,hint)=>CODE_LANGS.includes(hint)?hint:(g=>g==='java'||g==='json'?g:'generic')(guessLang(text));
const codeBlockHtml=(text,lang)=>'<pre class="cb" data-lang="'+lang+'">'+(text===''?'<br>':esc(text))+'</pre>';
const DROP_TAGS=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','TEMPLATE','NOSCRIPT','HEAD','TITLE','META','LINK','SVG','CANVAS','AUDIO','VIDEO','INPUT','BUTTON','SELECT','TEXTAREA','FORM']);
const IMG_SRC=/^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+$/;
const COLOR_RE=/^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\)|[a-z]{3,20})$/i;   // 16진수, rgb(), 영문 색 이름만 허용
const STYLE_RULES={
  'font-size':v=>/^\d{1,3}(\.\d+)?px$/.test(v)&&parseFloat(v)>=8&&parseFloat(v)<=200,
  'color':v=>COLOR_RE.test(v),
  'background-color':v=>COLOR_RE.test(v),
  'text-align':v=>/^(left|right|center|justify)$/.test(v)
};
function sanitizeHtml(html,keepColors=true){
  const doc=new DOMParser().parseFromString('<!doctype html><body>'+html,'text/html');   // 문서 밖에서 파싱하므로 아무것도 실행되지 않는다
  const out=document.createElement('div');
  const walk=(src,dst)=>{
    for(const n of src.childNodes){
      if(n.nodeType===3){
        if(/^\s*$/.test(n.nodeValue)&&n.nodeValue.includes('\n'))continue;   // 태그 사이의 줄바꿈 공백은 버린다
        dst.append(document.createTextNode(n.nodeValue));continue;
      }
      if(n.nodeType!==1)continue;
      const tag=TAG_ALIAS[n.tagName]||n.tagName;
      if(n.tagName==='IMG'){
        // 글 안에 넣은 이미지(data 주소)만 남기고, 바깥 주소 이미지는 버린다
        const src=n.getAttribute('src')||'';
        if(src.length<3000000&&IMG_SRC.test(src)){const im=document.createElement('img');im.src=src;const w=parseFloat(n.style.width);if(w>=20&&w<=3000)im.style.width=Math.round(w)+'px';dst.append(im)}
        continue;
      }
      if(DROP_TAGS.has(n.tagName))continue;
      if(n.tagName==='PRE'){
        // 코드 블록은 글만 남기고 다시 만든다 (색 입힌 span 같은 안쪽 태그는 버린다)
        const tx=preText(n).replace(/\r\n?/g,'\n').replace(/\n+$/,'');
        const pr=document.createElement('pre');pr.className='cb';pr.dataset.lang=codeLangOf(tx,n.dataset.lang);
        if(tx==='')pr.append(document.createElement('br'));else pr.textContent=tx;
        dst.append(pr);continue;
      }
      if(!OK_TAGS.has(tag)){walk(n,dst);continue}   // 모르는 태그는 벗기고 안쪽 내용만 남긴다
      if(tag==='BR'||tag==='HR'){dst.append(document.createElement(tag));continue}
      const el=document.createElement(tag),st=n.style;
      for(const p in STYLE_RULES){
        if(!keepColors&&(p==='color'||p==='background-color'))continue;
        const v=(st.getPropertyValue(p)||'').trim();
        if(v&&STYLE_RULES[p](v))el.style.setProperty(p,v);
      }
      if(tag==='UL'&&n.classList.contains('todo'))el.className='todo';
      if(tag==='LI'&&n.classList.contains('done'))el.className='done';
      // 다른 앱에서 온 span 서식(굵게, 기울임, 밑줄, 취소선)은 태그로 바꾼다
      let inner=el;
      const wrap=(cond,t2)=>{if(cond){const w=document.createElement(t2);inner.append(w);inner=w}};
      const fw=st.fontWeight||'',td=st.textDecorationLine||st.textDecoration||'';
      wrap(/^(bold|[6-9]00)$/.test(fw)&&tag!=='B'&&!BLOCK_TAGS.has(tag)&&!/^H\d$/.test(tag),'B');
      wrap(/underline/.test(td)&&tag!=='U'&&!BLOCK_TAGS.has(tag),'U');
      wrap(/line-through/.test(td)&&tag!=='S'&&!BLOCK_TAGS.has(tag),'S');
      walk(n,inner);
      dst.append(el);
    }
  };
  walk(doc.body,out);
  return out.innerHTML;
}
// 서식 있는 문서를 글자만 남긴 줄 단위 문자열로 바꾼다 (목록은 •, 1., ☐ 머리를 붙인다)
function toPlain(root,opt){
  const prefix=!opt||opt.prefix!==false;
  const out=[];let cur='';
  const flush=()=>{out.push(cur);cur=''};
  const start=()=>{if(cur!=='')flush()};
  const walk=(node,ctx)=>{
    for(const c of node.childNodes){
      if(c.nodeType===3){cur+=c.nodeValue;continue}
      if(c.nodeType!==1)continue;
      const tag=c.tagName;
      if(tag==='BR'){flush();continue}
      if(tag==='HR'){start();out.push('---');continue}
      if(tag==='PRE'){start();preText(c).split('\n').forEach(l=>out.push(l));continue}
      if(tag==='UL'||tag==='OL'){
        start();
        walk(c,{type:tag,todo:c.classList.contains('todo'),n:0,depth:(ctx.depth||0)+1});
        start();continue;
      }
      if(tag==='LI'){
        start();
        ctx.n++;
        if(prefix){

    const ordered=el.tagName==='OL',todo=el.classList.contains('todo');
    let n=0;
    for(const li of el.children){
      if(li.tagName!=='LI')continue;
      n++;
      const pad='  '.repeat(depth);
      const mark=todo?(li.classList.contains('done')?'- [x] ':'- [ ] '):ordered?n+'. ':'- ';
      // 목록 안에 목록이 있으면 글 부분과 따로 처리한다
      const clone=li.cloneNode(true);
      const subs=[...clone.querySelectorAll(':scope>ul,:scope>ol')];
      subs.forEach(x=>x.remove());
      lines.push(pad+mark+inline(clone).replace(/(  \n)+$/,'').trim());
      subs.forEach(x=>list(x,depth+1));
    }
  };
  const blocks=node=>{
    let loose=null;   // 블록 태그 밖에 바로 놓인 글
    const flush=()=>{if(loose){para('',loose);lines.push('');loose=null}};
    for(const c of node.childNodes){
      if(c.nodeType===3||(c.nodeType===1&&/^(B|U|S|SPAN|BR|IMG)$/.test(c.tagName))){
        if(!loose)loose=document.createElement('p');
        loose.append(c.cloneNode(true));continue;
      }
      if(c.nodeType!==1)continue;
      flush();
      const tg=c.tagName;
      if(tg==='HR'){lines.push('---','')}
      else if(tg==='PRE'){
        const tx=preText(c).replace(/\u00a0/g,' ').replace(/\n+$/,''),fence='\x60'.repeat(Math.max(3,...(tx.match(/\x60+/g)||[]).map(x=>x.length+1)));
        const lg=c.dataset.lang;
        codes.push(fence+(lg==='java'||lg==='json'?lg:'')+'\n'+tx+'\n'+fence);lines.push('\u0000'+(codes.length-1)+'\u0000','');
      }
      else if(/^H[1-3]$/.test(tg)){para('#'.repeat(+tg[1])+' ',c);lines.push('')}
      else if(tg==='UL'||tg==='OL'){list(c,0);lines.push('')}
      else if(tg==='P'||tg==='DIV'){
        if(c.querySelector('p,div,ul,ol,hr,h1,h2,h3,pre'))blocks(c);
        else{para('',c);lines.push('')}
      }
      else{para('',c);lines.push('')}
    }
    flush();
  };
  blocks(root);
  let md=lines.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+/,'').replace(/\n+$/,'')+'\n';
  md=md.replace(/\u0000(\d+)\u0000/g,(_,i)=>codes[+i]);
  if(images.length)md+='\n'+images.map((u,i)=>'[image'+(i+1)+']: '+u).join('\n')+'\n';
  return{md,images};
}

// ---- PDF 내보내기 ----
// 메모를 A4 쪽 크기로 나눠 그린 뒤 쪽마다 이미지로 넣어 PDF 한 파일로 만든다 (압축 파일이 아니라 바로 열리는 .pdf)
const PDF_CSS='.pdfdoc{font:15px/1.6 "Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;color:#111;white-space:pre-wrap;word-break:break-word}'+
  '.pdfdoc p,.pdfdoc div{margin:0}.pdfdoc h1{font-size:1.7em;margin:.3em 0;line-height:1.3}.pdfdoc ul,.pdfdoc ol{margin:.2em 0;padding-left:1.6em}'+
  '.pdfdoc ul.todo{list-style:none;padding-left:1.7em}.pdfdoc ul.todo>li{position:relative}.pdfdoc ul.todo>li::before{content:"☐";position:absolute;left:-1.5em}'+
  '.pdfdoc ul.todo>li.done::before{content:"☑"}.pdfdoc ul.todo>li.done{color:#888;text-decoration:line-through}'+
  '.pdfdoc pre{margin:.5em 0;padding:10px 12px;border:1px solid #ddd;border-radius:8px;background:#f5f5f8;font:13px/1.5 D2Coding,Consolas,"Malgun Gothic",monospace;white-space:pre-wrap;word-break:break-all}'+
  '.pdfdoc hr{border:0;border-top:1px solid #ccc;margin:.8em 0}.pdfdoc img{max-width:100%;height:auto;vertical-align:bottom}';
function makePdf(pages,ptW,ptH){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,fn)=>{offs[n]=len;push(n+' 0 obj\n');fn();push('\nendobj\n')};
  const N=pages.length,total=2+3*N;
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+N+' >>'));
  pages.forEach((pg,i)=>{
    const page=3+3*i,content=4+3*i,img=5+3*i,cs='q '+ptW+' 0 0 '+ptH+' 0 0 cm /Im0 Do Q';
    obj(page,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+ptW+' '+ptH+'] /Resources << /XObject << /Im0 '+img+' 0 R >> >> /Contents '+content+' 0 R >>'));
    obj(content,()=>push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(img,()=>{
      push('<< /Type /XObject /Subtype /Image /Width '+pg.w+' /Height '+pg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.data.length+' >>\nstream\n');
      push(pg.data);push('\nendstream');
    });
  });
  const xref=len;
  push('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
  for(let i=1;i<=total;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
let pdfBusy=false;
async function savePdf(t){
  if(pdfBusy)return;
  const src=sanitizeHtml(t.html||textToHtml(t.text));
  if(!t.text.trim()&&!/<img\b/.test(src)){flash('내보낼 내용이 없습니다');return}
  pdfBusy=true;flash('PDF를 만드는 중입니다…');
  let probe=null;
  try{
    const PW=794,PH=1123,M=48,CW=PW-2*M,CH=PH-2*M,K=2;   // A4를 96dpi로 본 크기, 여백 48px, 2배 선명도
    // 1) 화면 밖에서 같은 글꼴로 배치해 보고, 블록마다 위치를 잰다
    const st=document.createElement('style');st.textContent=PDF_CSS;
    probe=document.createElement('div');probe.style.cssText='position:fixed;left:-99999px;top:0;width:'+CW+'px;visibility:hidden';
    const doc=document.createElement('div');doc.className='pdfdoc';doc.style.width=CW+'px';doc.innerHTML=src;
    probe.append(st,doc);document.body.append(probe);
    const imgs=[...doc.querySelectorAll('img')];
    await Promise.all(imgs.map(im=>im.complete?0:new Promise(ok=>{im.onload=im.onerror=ok})));
    const total=doc.scrollHeight,tops=[...doc.children].map(c=>c.offsetTop);
    // 2) 쪽 나누기: 쪽 끝을 넘는 첫 블록의 위쪽에서 끊는다 (블록이 한 쪽보다 길면 그냥 자른다)
    const cuts=[];let start=0;
    while(start<total-1){
      const lim=start+CH;
      if(lim>=total){cuts.push([start,total]);break}
      let at=0;for(const tp of tops)if(tp>start+CH*0.35&&tp<=lim)at=tp;
      const end=at||lim;cuts.push([start,end]);start=end;
    }
    // 3) 쪽마다 SVG(foreignObject)로 그려 JPEG 로 만든다
    const body=new XMLSerializer().serializeToString(doc);
    const pages=[];
    for(const[a,b]of cuts){
      const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+PW*K+'" height="'+PH*K+'" viewBox="0 0 '+PW+' '+PH+'">'+
        '<rect width="'+PW+'" height="'+PH+'" fill="#fff"/>'+
        '<foreignObject x="'+M+'" y="'+M+'" width="'+CW+'" height="'+(b-a)+'">'+
        '<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+CW+'px;height:'+(b-a)+'px;overflow:hidden"><style>'+PDF_CSS+'</style>'+
        '<div style="margin-top:-'+a+'px">'+body+'</div></div></foreignObject></svg>';
      // blob 주소로 그리면 브라우저가 그림을 '보안상 위험'으로 표시해 JPEG로 뽑을 수 없으므로 data 주소를 쓴다
      const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('render'));i.src=url});
      const c=document.createElement('canvas');c.width=PW*K;c.height=PH*K;
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0);
      const jb=await new Promise((ok,no)=>c.toBlob(x=>x?ok(x):no(new Error('jpeg')),'image/jpeg',0.92));
      pages.push({data:new Uint8Array(await jb.arrayBuffer()),w:c.width,h:c.height});
    }
    download(makePdf(pages,595.28,841.89),safeName(t.title)+'.pdf');
    flash('PDF 파일로 내보냈습니다 ('+pages.length+'쪽)');
  }catch(e){
    flash('PDF로 만들지 못했습니다. HTML 저장 후 인쇄(PDF로 저장)를 이용해 주세요');
  }finally{
    if(probe)probe.remove();
    pdfBusy=false;
  }
}

const TEXT_EXT=/\.(txt|log|ini|md|json|csv|ps1|psd1|psm1|inf|scp|wtx|html?)$/i;
async function openFile(file){
  if(file.size>MAX_BYTES){flash('파일이 너무 큽니다 (20MB 이하만 열 수 있습니다)');return}
  if(file.type.startsWith('image/')){
    const a=active();
    if(a.kind==='text'&&rt[a.id]&&rt[a.id].addImage){rt[a.id].addImage(file,null);return}
    run('openImageFile',file);return;
  }
  if(/\.npaint$/i.test(file.name)){importProject(await file.text());return}
  // 코드 탭이 열려 있거나 코드 확장자이면 코드 탭으로 연다
  if(active().kind==='code'||CODE_EXT_RE.test(file.name)){await openCodeFile(file);return}
  if(!(file.type.startsWith('text/')||TEXT_EXT.test(file.name))){flash('지원하지 않는 파일 형식입니다');return}
  const buf=await file.arrayBuffer();
  let text;
  try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}
  catch(e){text=new TextDecoder('euc-kr').decode(buf)}
  if(/\.json$/i.test(file.name)&&text.slice(0,300).includes('"notepad-paint"')&&importProject(text))return;
  newTab('text');
  const t=active();
  if(/\.html?$/i.test(file.name)||file.type==='text/html'){
    // HTML 문서는 서식을 살려서 연다 (허용된 서식만 남긴다)
    const body=new DOMParser().parseFromString(text,'text/html').body;
    t.html=sanitizeHtml(body?body.innerHTML:'');
    const holder=document.createElement('div');holder.innerHTML=t.html;t.text=toPlain(holder);
  }else{t.text=text;t.html=textToHtml(text)}
  t.title=file.name.replace(/\.[^.]+$/,'');t.custom=true;
  render();save();
}

// ---- 코드 해석 (클래스 구조, 호출 흐름) ----
function umlStrip(src,py){
  let o='',i=0;const n=src.length;
  while(i<n){
    const c=src[i],d=src[i+1];
    if(!py&&c==='/'&&d==='/'){while(i<n&&src[i]!=='\n')i++;continue}
    if(!py&&c==='/'&&d==='*'){i+=2;while(i<n&&!(src[i]==='*'&&src[i+1]==='/'))i++;i+=2;o+=' ';continue}
    if(py&&c==='#'){while(i<n&&src[i]!=='\n')i++;continue}
    if(py&&(src.startsWith('"""',i)||src.startsWith("'''",i))){const q=src.substr(i,3);i+=3;while(i<n&&!src.startsWith(q,i))i++;i+=3;o+='""';continue}
    if(c==='"'||c==="'"||(c==='`'&&!py)){
      let j=i+1;while(j<n&&src[j]!==c&&src[j]!=='\n'){if(src[j]==='\\')j++;j++}
      o+=c+c;i=j+1;continue;
    }
    o+=c;i++;
  }
  return o;
}
function umlClose(s,i){let d=0;for(let k=i;k<s.length;k++){if(s[k]==='(')d++;else if(s[k]===')'&&--d===0)return k}return s.length}
function umlBalanced(s){let d=0;for(const c of s){if(c==='(')d++;else if(c===')')d--}return d<=0}
// 맨 바깥 쉼표로 나누기 (제네릭, 괄호 안은 건드리지 않는다)
function umlSplit(s){
  const o=[];let d=0,c='';
  for(let i=0;i<s.length;i++){
    const k=s[i];
    if('(<[{'.includes(k))d++;
    else if(')]}'.includes(k))d--;
    else if(k==='>'&&s[i-1]!=='-'&&s[i-1]!=='=')d--;
    if(k===','&&d<=0){o.push(c);c=''}else c+=k;
  }
  if(c.trim())o.push(c);
  return o.map(x=>x.trim()).filter(Boolean);
}
const UML_MODS='public|private|protected|internal|static|final|abstract|override|virtual|readonly|const|val|var|lateinit|open|async|default|synchronized|native|volatile|transient|sealed|suspend|operator|inline|new|extern|unsafe|partial|export|declare|fun|function';
const UML_MOD_RE=new RegExp('^('+UML_MODS+')\\s+');
function umlMods(h){
  const m={vis:'',prop:false};let x;
  while((x=UML_MOD_RE.exec(h))){
    const w=x[1];
    if(w==='public')m.vis='+';else if(w==='private')m.vis='-';else if(w==='protected')m.vis='#';else if(w==='internal')m.vis='~';
    if(/^(public|private|protected|internal|val|var|readonly)$/.test(w))m.prop=true;
    h=h.slice(x[0].length);
  }
  return{h,m};
}
function umlParam(p){
  p=p.trim();if(!p)return null;
  const u=umlMods(p);let h=u.h.replace(/^(ref|out|params|this)\s+/,'');
  h=h.replace(/\s*=(?!>)[\s\S]*$/,'').trim();
  let name,type='',x;
  if((x=/^(\.\.\.)?([\w$]+)\s*\??\s*:\s*([\s\S]+)$/.exec(h))){name=(x[1]||'')+x[2];type=x[3].trim()}
  else if((x=/^([\s\S]*\S)\s+([\w$]+)$/.exec(h))){type=x[1].trim();name=x[2]}
  else name=h;
  return{name,type,prop:u.m.prop,vis:u.m.vis};
}
// 클래스 본문의 멤버 하나 (필드 또는 메소드)
function umlCMember(h,cname){

  if(/^(return|throw|if|for|while|else|try|catch|finally|switch|import|package|using|init\b|static$|companion|typealias|case\b|default:|new\b|namespace)/.test(h))return null;
  if(/(^|\s)(class|interface|enum|struct|trait|namespace|object|record|type|typealias)\s+[A-Za-z_$]/.test(h.split('(')[0].split('=')[0]))return null;

    const nm=/([A-Za-z_$][\w$]*)\s*\??$/.exec(pre);if(!nm)return null;
    const name=nm[1];if(/^(if|for|while|switch|catch|return|new)$/.test(name))return null;
    let ret=pre.slice(0,nm.index).trim();

    const close=umlClose(x,par);
    const params=umlSplit(x.slice(par+1,close)).map(umlParam).filter(Boolean);
    const ar=/^:\s*([^{=]+?)(?:\s+(?:throws|where)\b.*)?$/.exec(x.slice(close+1).trim());
    if(ar)ret=ar[1].trim();

  let d=x;const e2=d.search(/=(?!>)/);if(e2>=0)d=d.slice(0,e2);

  if(dec.length>1){   // int a, b;  처럼 한 줄에 여러 필드
    const first=umlCMember((u.m.vis==='-'?'private ':u.m.vis==='#'?'protected ':'')+dec[0],cname);
    if(first&&first.k==='f')return[first,...dec.slice(1).map(nm=>({k:'f',vis,name:nm.replace(/[^\w$].*$/,''),type:first.type}))];

  if((f=/^([\s\S]*\S)\s+([\w$]+)$/.exec(d)))return{k:'f',vis,name:f[2],type:f[1].trim()};
  if(/^[\w$]+$/.test(d))return{k:'f',vis,name:d,type:''};
  return null;
}
// 본문을 문장 단위로 쪼갠다 (세미콜론 또는 줄바꿈, { } 블록은 건너뛴다)
function umlStatements(body){
  const out=[],n=body.length;let cur='',p=0;
  for(let i=0;i<n;i++){
    const c=body[i];
    if(c==='('||c==='[')p++;else if(c===')'||c===']')p--;
    if(c==='{'&&p<=0){
      let d=1,j=i+1;while(j<n&&d){if(body[j]==='{')d++;else if(body[j]==='}')d--;j++}
      out.push({h:cur.trim(),b:body.slice(i+1,j-1)});cur='';i=j-1;continue;
    }
    if(c===';'&&p<=0){out.push({h:cur.trim(),b:''});cur='';continue}
    if(c==='\n'&&p<=0){
      const t=cur.trim();
      if(t&&!/[,:=+\-*/&|?<.]$/.test(t)&&!/^\s*(throws|where|extends|implements|\{|:|=|\.|\?)/.test(body.slice(i+1))){out.push({h:t,b:''});cur='';continue}
